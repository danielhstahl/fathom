# cargo-deny configuration — the licence, advisory, source and ban gate ADR-002 §8 requires.
# Written by hand and checked by `python3 tools/check_workspace.py lint` (rules D01-D08); CI runs
# `cargo deny check` over the resolved lockfile. Every ignore/exception below must carry a `# why:`.

[graph]
targets = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin", "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  # why: `notify` (watch mode, behind `fathom-ingest/watch`) is CC0-1.0 — a public-domain dedication,
  # not a copyleft licence. Accepted at the same tier as Zlib/ISC. If the product owner would rather
  # not carry a CC0 dependency at all, the alternative is pinning notify to a release under another
  # licence or dropping `watch`; that is a product call, so it is written down rather than assumed.
  "CC0-1.0",
]
# Copyleft is refused by omission, and that omission is stated on purpose: cargo-deny 0.20 removed
# `[licenses] deny` (EmbarkStudios/cargo-deny#611), and an allow-list already means "anything not
# listed fails". The names are written out anyway so the refusal is somewhere a reviewer reads —
# AGPL-3.0, GPL-3.0 and SSPL-1.0 must not appear in `allow` above, which is what rule D03 checks. A
# dependency whose *only* licence is one of those cannot enter this workspace without a decision, and
# `cargo deny check licenses` is what says so on every PR rather than in a wiki.

[licenses.private]
ignore = true    # why: our own crates are `publish = false` and carry the workspace licence

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  { name = "git2",         reason = "ADR-002 §4.2: gix is the only path to git objects" },
  { name = "libgit2-sys",  reason = "ADR-002 §4.2: libgit2 links a transport stack we would have to audit" },
  { name = "openssl-sys",  reason = "ADR-002 §6: no TLS stack outside a `net-*` feature" },
  { name = "native-tls",   reason = "ADR-002 §6: platform TLS only inside a `net-*` feature" },
  { name = "hyper",        reason = "ADR-002 §6: an HTTP stack may only arrive via `net-http-transport`" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
