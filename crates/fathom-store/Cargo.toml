[package]
name = "fathom-store"
description = "Fathom's SQLite index, cache and blob store: schema and migrations, analyzer manifest and cache keys, retention and the writer lease."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rustix.workspace = true
serde.workspace = true
# ADR-004 §5's cache keys and §10.2's identity digest are sha256; the same digest `e1.2` uses for
# `path_hash` and `message_hash`, so one crate serves both (`gix` speaks sha1 only, ADR-002 §4.2).
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
fallible-iterator.workspace = true
fathom-core.workspace = true
rusqlite = { workspace = true, optional = true }
libsqlite3-sys = { workspace = true, optional = true }

# ADR-002 §6.2 publishes these three feature names; lint `F01` fails a manifest that adds or drops one,
# and `F05` keeps `sqlite-bundled` and `sqlite-system` from being enabled *by the same feature*.
#
# One deviation from §3's dependency table, made deliberately by `e0.7` and recorded in
# docs/adr/0002-workspace.md §10.3: `rusqlite` is gated rather than non-optional. A build with neither
# SQLite feature would otherwise have to link a *system* libsqlite3, which is absent on
# `aarch64/x86_64-pc-windows-msvc` runners and on most distro toolchains — and §8.3's own
# `--no-default-features --features minimal` job and this ticket's "clean clone builds" criterion both
# ask for exactly that build. Gating it makes §6.1 true instead of aspirational: a library built with
# no features is a valid, testable configuration, and here it is also one that needs no C toolchain.
# The shipped binary turns `sqlite-bundled` on, exactly as published, so nothing a user installs changes.
[features]
default = []
sqlite-bundled = ["dep:rusqlite", "dep:libsqlite3-sys"]
sqlite-system = ["dep:rusqlite"]
mmap = []

# The only dev-dependency in this crate, and it is here for one file: `benches/budgets.rs`, the
# criterion half of `e0.11`'s budget harness. Criterion is the right tool for the budgets whose unit is
# microseconds and whose honest statistic is a percentile with a confidence interval — it is also the
# only thing in the tree that does outlier detection and regression analysis on a sample, which is what
# makes "more than a 15 % slower" a defensible sentence rather than a shrug. It is a
# `[dev-dependencies]` entry, so it is absent from every build that ships (ADR-002 §3), and
# `cargo deny`'s licence gate sees it in the lock but no shipped artefact ever links it.
[dev-dependencies]
criterion = { workspace = true }

# The store's budgets only exist once a SQLite backend is compiled in, so the bench does too: without
# either `sqlite-*` feature the crate has no `Store` to measure (see the comment on `[features]`).
# `harness = false` is criterion's requirement, and `test = false` is this ticket's: without it
# `cargo test --workspace --all-features` runs every bench to completion, which turns a 40-second
# budget gate into a ten-minute one and makes the cheap suite expensive.
[[bench]]
name = "budgets"
harness = false
test = false
required-features = ["sqlite-bundled"]
