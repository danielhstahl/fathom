[package]
name = "fathom-analyze"
description = "Every Fathom analysis: taxonomy, structure, dependencies, graph, risk, the attention queue, and the `insight` facade every surface reads through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex.workspace = true
similar.workspace = true
toml_edit.workspace = true
globset.workspace = true
rayon.workspace = true
smallvec.workspace = true
fathom-core.workspace = true
fathom-store.workspace = true
fathom-ingest.workspace = true
sha2.workspace = true                       # the build's own feature digest (ADR-002 §10.2, `build.rs`)
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

# The published list is ADR-002 §6.2 and lint `F01` fails an addition or an omission (R11).
#
# Each `lang-*` is its own feature because each is a C build, and the six together are the difference
# between a thirty-second and a four-minute laptop build (§6.5). `net-*` is the only prefix that may
# enable an outbound client (lint `N02`), and a default build links none (lint `N03`, checked by CI's
# `cargo tree` job and by `tools/check_workspace.py shipped`).
[features]
default = []
lang-rust = ["dep:tree-sitter", "dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter", "dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter", "dep:tree-sitter-go"]
lang-typescript = ["dep:tree-sitter", "dep:tree-sitter-typescript"]
lang-ruby = ["dep:tree-sitter", "dep:tree-sitter-ruby"]
lang-java = ["dep:tree-sitter", "dep:tree-sitter-java"]
langs-all = ["lang-rust", "lang-python", "lang-go", "lang-typescript", "lang-ruby", "lang-java"]
# One feature per dependency ecosystem (`e2.5`, ADR-002 §6.2). None of them pulls a third-party crate — the
# parsers are hand-written and tolerant, which is the ticket's requirement, not an economy — so what the
# gate buys is *surface area and compile time per ecosystem*, and the ability to ship a CI binary that only
# speaks the languages the repository under review actually uses. A gated-out ecosystem is still
# recognized: its files come back `unparsed` naming the feature to rebuild with, never missing.
deps-node = []
deps-cargo = []
deps-python = []
deps-go = []
deps-ruby = []
deps-elixir = []
deps-jvm = []
deps-dotnet = []
deps-all = ["deps-node", "deps-cargo", "deps-python", "deps-go", "deps-ruby", "deps-elixir",
            "deps-jvm", "deps-dotnet"]
# The store-facing half of this crate — `index`, and the `sink` that writes what `fathom-ingest` produced —
# needs a SQLite backend to exist, exactly as `fathom-store`'s own `spine` and `cache` modules do. The
# feature names are the same three §6.2 publishes for `fathom-store`, forwarded rather than invented, so
# `cargo build -p fathom-analyze --no-default-features` stays a valid build (ADR-002 §6.1) and the shipped
# binary turns one on and gets the whole product.
sqlite-bundled = ["fathom-store/sqlite-bundled"]
sqlite-system = ["fathom-store/sqlite-system"]
net-advisories = ["dep:ureq"]
net-llm = ["dep:ureq"]

[dev-dependencies]
fathom-fixtures.workspace = true
# `e4.4`'s acceptance criterion is that weight changes have a "deterministic, monotonic effect on
# ranking", and a monotonicity claim over twelve continuous inputs is not a set of hand-written cases —
# it is a property. `proptest` is already in the workspace through `fathom-tui` (`e5.5`), it is a
# dev-dependency so it never reaches the shipped binary, and its `std`-only feature set is what the
# workspace pins.
proptest.workspace = true

# `episodes` and `incremental_index` are the store-facing half of this crate's test surface: they import
# `fathom_analyze::index` and `fathom_store::{spine, cache}`, every one of which is gated behind a SQLite
# backend (§6.2). Declaring that here rather than in the CI invocation is what makes
# `cargo build -p fathom-analyze --features langs-all --all-targets` — the spike `s1` gate, which builds the
# harness against all six grammars — a build that works at *any* feature set instead of one that happens to
# pass only when workspace feature unification turns SQLite on from a sibling crate. Same spelling as
# `fathom-store`'s `budgets` bench: the target names the feature it needs.
[[test]]
name = "episodes"
required-features = ["sqlite-bundled"]

[[test]]
name = "incremental_index"
required-features = ["sqlite-bundled"]

# The review ledger (`e4.6`) reads the episode table and the mirror table, both of which exist only with a
# SQLite backend, so the target names the feature it needs rather than relying on unification.
[[test]]
name = "ledger"
required-features = ["sqlite-bundled"]

# The comparison of two endpoints (`e5.3`, `reco-ifo`) is composed from real delta documents, and building
# a delta document means reading the store's row shapes — the same reason the two targets above name the
# feature instead of relying on a sibling crate to switch it on.
[[test]]
name = "compare_property"
required-features = ["sqlite-bundled"]

# The one search box's ranking (`e5.2`, `reco-mkc`): a golden ordering, a total order, and the 50 ms p95
# budget measured on a 10 000-episode corpus. It builds its corpus from `search::Entry` shapes, so it needs
# no store and no feature gate — the store-backed half of `e5.2` is covered by `crates/fathom-cli`'s
# `search_verb.rs`.

# The `s1` spike harness (`reco-alj`) lives here, not in the library: it is throwaway code that
# has to compile against the same six grammar crates `e3.1` will ship with, and `required-features`
# keeps it — and the C build of all six — out of every default `cargo build` and `cargo test`.
[[example]]
name = "s1_spike"
required-features = ["langs-all"]

# The structural extractor's corpus harness (`e3.1`, `reco-zoz`). Gated for the same reason as
# `s1_spike`: it links the grammars, and a default `cargo test` must not pay for three C builds. The
# three names are exactly the languages `e3.1` ships — `e3.1b` adds the other three and this line
# grows with them.
# The structural extractor core's tests (`e3.1`, `reco-zoz`). Named here for the same reason as
# `s1_spike` below: the corpus it measures is three grammars deep, and a default `cargo test` must not
# pay for three C builds it was never asked to exercise.
[[test]]
name = "structure_core"
required-features = ["lang-rust", "lang-python", "lang-typescript"]

# The tail (`e3.1b`, `reco-dlp.1`): Go, Ruby and Java and the scan-policy knobs. All six grammars,
# because the tail's assertions are about three specific grammars' rules rather than about the model,
# so there is no subset of features at which the file would say anything true.
[[test]]
name = "structure_tail"
required-features = ["langs-all"]

# Six languages, one report: `--check` compares a report the whole board reads, and a build that
# speaks three of the six cannot reproduce it — so the example asks for all six rather than silently
# reporting three and calling the difference a missing corpus.
[[example]]
name = "structure_harness"
required-features = ["langs-all"]

# The Guardrail 3 calibration harness (`e4.3a`) indexes each pinned repository into a store of its own,
# so it needs a SQLite backend to exist at all — the same spelling as the `episodes` and `ledger` test
# targets above, and for the same reason: `cargo build -p fathom-analyze --all-targets` has to work at
# every feature set, not only the one a sibling crate happens to switch on.
[[example]]
name = "g3_calibration"
required-features = ["sqlite-bundled"]

# The graph chain's measurement harness (`e3.2`, `reco-8s4`) records a synthetic repository through
# the lane into a real store, so it needs a SQLite backend — and nothing else: the structures are
# synthesised, so it deliberately does not ask for the grammars the other examples need.
[[example]]
name = "graph_harness"
required-features = ["sqlite-bundled"]

# The graph lane (`reco-8s4`) writes and reads the graph tables, so it names the backend it needs the
# same way `episodes` and `ledger` do. The pure half — `tests/graph.rs` — deliberately does not, which
# is the point: ADR-002 §6.1 says a `--no-default-features` build still gets the graph model and the
# five queries, and a test target that asked for SQLite would stop proving that.
[[test]]
name = "graph_lane"
required-features = ["sqlite-bundled"]

# The architecture delta (`e3.3`, `reco-8wg`) has two halves and they are gated differently. The
# store-backed one — which rung answered, what it cost, and that every rung agrees — replays a history
# through the lane, so it names the backend exactly the way `graph_lane` does. The pure half
# (`graph_diff.rs`, `graph_diff_property.rs`) names nothing at all, which is the point: ADR-002 §6.1
# says a `--no-default-features` build still gets the six findings, the churn window and the JSON form.
[[test]]
name = "graph_diff_lane"
required-features = ["sqlite-bundled"]

# The cycles (`e3.5`, `reco-8md`): the per-episode answer over the graph lane, so it needs a SQLite
# backend exactly the way `graph_lane` does. The model itself is asserted in `tests/cycles.rs`, which
# names no feature at all — that split is the point, and it is what keeps ADR-002 §6.1's
# `--no-default-features` build honest about cycles as well as about the graph.
[[test]]
name = "cycles_episode"
required-features = ["sqlite-bundled"]

# The layering rules (`e3.6`, `reco-cfp`): one episode's violation delta over the graph lane, so it needs
# a SQLite backend for the same reason `cycles_episode` does. `tests/layers.rs` names no feature at all —
# the judgment is a function of a graph, a naming, a rules table and the line evidence, and ADR-002 §6.1
# wants a `--no-default-features` build to be able to say what the architecture owes.
[[test]]
name = "layers_episode"
required-features = ["sqlite-bundled"]

# The memory ceilings (`e7.3`, `reco-93w`): the spine hand-off and the index it drives, so the target
# names the backend it needs. Without this entry a `--no-default-features` build of the crate — the state
# [ADR-002](../../docs/adr/0002-workspace.md) §6.1 promises still answers questions — fails to compile
# this target instead of skipping it.
[[test]]
name = "memory_ceiling"
required-features = ["sqlite-bundled"]

# The public API surface diff (`e3.7`, `reco-p5u`): six languages, one report shape. All six grammars,
# for the same reason `structure_tail` names all six — an answer that is `Incomplete` because the
# grammar was not compiled is an answer about the build, not about the repository.
[[test]]
name = "api_surface"
required-features = ["langs-all"]
