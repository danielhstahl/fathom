lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      react:
        specifier: ^18.2.0
        version: 18.2.0
      utils:
        specifier: link:packages/utils
        version: link:packages/utils
    devDependencies:
      vitest:
        specifier: ^1.6.0
        version: 1.6.0

  packages/utils:
    dependencies:
      lodash:
        specifier: ^4.17.21
        version: 4.17.21

packages:

  '@babel/parser@7.23.0':
    dependencies:
      '@babel/types': 7.23.0
    dev: true

  lodash@4.17.21:
    license: MIT

  react@18.2.0:
    dependencies:
      loose-envify: ^1.1.0

snapshots:

  react@18.2.0:
    dependencies:
      loose-envify: 1.4.0
