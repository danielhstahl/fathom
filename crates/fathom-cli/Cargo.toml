[package]
name = "fathom-cli"
description = "The fathom binary: one process, one version, one set of feature decisions, and the exit codes CI branches on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# One author, because one person is cutting the alpha: this line is not a contributor list, it is the
# **manufacturer** the Windows msi reports in "Add or remove programs" (WiX reads `authors`, and the msi
# build fails without it). When that list becomes longer than one name, the first entry is the one the
# installer will keep saying, so changing it after the first msi ships is a rename users have to watch.
authors = ["danielstahl"]

# cargo-dist needs a home for the artefacts before there is a public remote to point at — the same
# pattern ADR-002 §10.1 used for `license`: a documented default so `e0.7` is not blocked by an open
# question, plus a note that it must be confirmed. Replace this with the real URL in the same PR that
# pushes the repository: the installer scripts, the release body and `dist-manifest.json` all take their
# base from it, so a wrong value is a broken install rather than a cosmetic one.
repository = "https://github.com/danielstahl/fathom"
# The same placeholder, in its second place: `cargo-dist` puts it in the Homebrew formula's `homepage`,
# and a formula without one is a package a reviewer cannot look at before installing it. Replace it in
# the same PR that replaces `repository` (`docs/concepts/release.md` §3 step 2).
homepage = "https://github.com/danielstahl/fathom"

[[bin]]
name = "fathom"
path = "src/main.rs"

# `publish = false` (ADR-002 §10.1: no crates.io promises in v1) would otherwise hide this binary from
# cargo-dist, whose entire job is publishing it. The one line that says "not published, but released".
[package.metadata.dist]
dist = true

# The msi's two identities: `upgrade-guid` says "this is the same product as the one you have installed"
# and `path-guid` says "this is the same install directory". `dist` generated both once (`dist init`),
# and the *only* rule about them is that they must never be regenerated after an msi has been published:
# a new upgrade-guid means a user's next install is a second product beside the first instead of an
# upgrade of it. `crates/fathom-cli/wix/main.wxs` is the other half, and `dist` owns that file too.
[package.metadata.wix]
upgrade-guid = "6D7047EA-D319-4302-A5DB-3107F367B40C"
path-guid = "A0229A50-9C5B-489F-A8EB-1A1A49807A56"
license = false
eula = false

[lints]
workspace = true

[dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
eyre.workspace = true
color-eyre.workspace = true
# The daemon's stop flags (`e6.3`): `signal-hook`'s flag API is the only async-signal-safe way to turn a
# signal into an `AtomicBool` without `unsafe`, and the crate is already in the shipped binary through
# `crossterm` (ADR-002 §6.2) — so this makes an existing vendor a *direct* dependency, which §9's table
# has to show, and it is gated with `watch` because nothing else in the binary listens for a signal.
signal-hook = { workspace = true, optional = true }
# `setsid`, for the detached `fathom daemon start`; already in the shipped closure through `fathom-store`.
rustix = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
fathom-core.workspace = true
fathom-store.workspace = true
fathom-ingest.workspace = true
fathom-analyze.workspace = true
fathom-tui = { workspace = true, optional = true }
fathom-mcp = { workspace = true, optional = true }

# This is the only crate with default features, and the default set *is* the shipped product
# (ADR-002 §6.1, R5): it is published in §6.2, printed by `fathom --version`, diffed in CI (`F03`) and
# asserted by `tools/check_workspace.py shipped`. `minimal` is the headless CI-gate binary `e6.6` puts
# inside pipelines: `--no-default-features --features minimal`.
[features]
default = ["tui", "mcp", "watch", "sqlite-bundled", "langs-all", "deps-all"]
tui = ["dep:fathom-tui"]
mcp = ["dep:fathom-mcp"]
watch = ["fathom-ingest/watch", "dep:signal-hook", "dep:rustix"]
sqlite-bundled = ["fathom-store/sqlite-bundled", "fathom-analyze/sqlite-bundled"]
langs-all = ["fathom-analyze/langs-all"]
# Every dependency ecosystem (`e2.5`). On by default for the same reason `langs-all` is: a review tool that
# silently skipped the dependencies of the one ecosystem the repository under review uses is worse than one
# that says which feature it was built without.
deps-all = ["fathom-analyze/deps-all"]
minimal = []
net-advisories = ["fathom-analyze/net-advisories"]
net-llm = ["fathom-analyze/net-llm"]
net-http-transport = ["fathom-mcp/net-http-transport"]
schema-gen = ["fathom-core/json-schema"]

# No `fathom-fixtures` here yet: the binary-level tests drive the real process and need no fixture
# generator. `e1.12` (the MVP acceptance scenario) is the ticket that wants one.
[dev-dependencies]
# `tests/tui_data.rs` reads the store back to check what a frame was built from, and writes one
# `session_state` row so the shell opens on the timeline instead of the queue (`reco-wzt`). The feature
# is turned on here and nowhere in the binary's own dependency list, exactly as `fathom-ingest` does it.
fathom-store = { workspace = true, features = ["sqlite-bundled"] }
