# The SBOM and the licence report, generated and published per release (`e6.8`, reco-h7p).
#
# Two events, one generator:
#
#   * **every PR and every merge** — `tools/gen_sbom.py check` regenerates `sbom/` in memory and fails on
#     a byte of difference. A committed artefact nobody re-generates is a document that lies about the
#     release it names, which is the failure this workflow exists to prevent.
#   * **every published release** — the two committed artefacts are attached to the release, so "what is
#     in the binary I installed" has an answer on the download page and not only in the repository.
#
# The artefacts are *committed* and then attached, rather than built at release time: a release asset that
# is generated independently of the tree it names is an artefact nobody can reproduce from the tag, and
# `dist generate --check` owns `release.yml`, so this file is where a hand-written release step can live
# without fighting the generator that owns the other one.

name: SBOM and licence report

on:
  pull_request:
  push:
    # Every branch, not only the default one: `master` sat frozen for three weeks while the work was on a
    # branch no trigger could reach, and nothing in CI could see it (`e11.1` §5.2, `reco-kwg6`). `R07` of
    # `tools/check_workflows.py` refuses a list of names here, and *Which branch a gate runs on* in
    # docs/concepts/ci-gate.md is the prose.
    branches: ["**"]
  release:
    types: [published]

# A push to a branch that already has a run in flight must not pay for it again: `e11.1` §2.4 counted 7
# red runs in thirty days whose only fault was being superseded, and every one of them ran to the end
# anyway. Per workflow, so two workflows never share a queue; per ref, so two pull requests never cancel
# each other. Rule `R02` of `tools/check_workflows.py` asks every `pull_request` workflow for this block.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: the committed artefacts match the lockfile
    # regenerate both CycloneDX documents and diff them against the committed bytes; nothing is compiled and the dependency resolve is the slow part
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: regenerate and diff
        # `cargo metadata --locked` is how a licence is read correctly; the runner has the lockfile, the
        # index and the network, and needs none of the compile.
        run: python3 tools/gen_sbom.py check

  publish:
    name: attach them to the release
    if: github.event_name == 'release'
    needs: [check]
    # download what the release already published, two `gh api` calls and an upload; nothing is built here either
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: the same check, on the tag's own tree
        run: python3 tools/gen_sbom.py check
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(sbom/*.cdx.json sbom/*-licenses.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no SBOM or licence report in sbom/ — run `python3 tools/gen_sbom.py write`"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "attached: ${files[*]}"
