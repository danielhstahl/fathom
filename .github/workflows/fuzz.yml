# Fuzzing: the readers that take repository content, driven with bytes nobody wrote (`e7.8`, `reco-41a`).
#
# One cadence, since `e11.2` (`reco-374v.2`): **nightly, and on `workflow_dispatch`** — thirty minutes per
# target, on a matrix so the wall clock stays inside a nightly's budget. That is the "30-minute smoke runs
# in CI" the ticket asked for, and the run that finds the shape no seed contained.
#
# The per-PR smoke (one minute per target, three targets) is gone, and the measurement is why
# (`e11.1`, `.plan/ci-triage-reco-374v.md`): 403 measured runner-minutes over 19 runs with a
# `cargo install cargo-fuzz` and a nightly toolchain in every one of them and no cache at all, and its
# failures were the two things a pull request cannot act on — nine job-legs that died on a
# `fuzz/Cargo.toml` with no `cargo-fuzz = true` marker (`reco-com`, `reco-yuk`), and three
# `One minute per target` legs on the lockfile target that failed on three consecutive runs and then never
# again, with nothing about fuzzing in between. It is the only job in the fleet whose failure the census
# could not explain from the tree, which is the definition of a gate people learn to ignore.
#
# What a pull request still has to prove about fuzzing is in `contracts.yml`, in seconds and with no nightly
# toolchain to wait for: `python3 tools/gen_fuzz_corpus.py check` (the committed corpus is the generated
# one), and `check_workflows.py`'s `P03`/`P04`, which refuse a fuzz step run from inside `fuzz/` and a fuzz
# manifest cargo-fuzz will not open. Those are the checks that catch a *neutered* fuzzing setup; the
# minutes are here.
#
# The corpus grows in only one direction: a crash artefact becomes a regression test in
# `crates/fathom-analyze/tests/hardening.rs` (or `…/fathom-ingest/tests/hooks_hardening.rs`) and, if it is a
# *shape* rather than a one-off byte sequence, a new seed in `tools/gen_fuzz_corpus.py`. Committing raw
# artefacts into `fuzz/corpus/` would make `python3 tools/gen_fuzz_corpus.py check` — the gate that keeps the
# corpus reproducible — false.
#
# Nightly toolchain, and only here: libFuzzer is `-Zsanitizer`, which stable cannot pass. The main workspace
# stays on the pinned stable toolchain precisely so that `cargo build --workspace` remains a promise a clean
# clone can keep (`fuzz/Cargo.toml` explains the separate workspace).
#
# Two things this workflow depends on that no YAML reader can see, both of them paid for by rule `P04` and
# rule `P03` of `tools/check_workflows.py`:
#
# * `fuzz/Cargo.toml` carries `[package.metadata] cargo-fuzz = true`. cargo-fuzz reads that marker first,
#   before it builds a target, and its whole report when the marker is missing is "Error: manifest
#   fuzz/Cargo.toml does not look like a cargo-fuzz manifest. Add following lines to override:" — no target,
#   no compile error, nothing to bisect. That is what every job below printed for a nightly cycle (`reco-com`)
#   while the marker existed nowhere in this repository, and nothing else here (not `cargo build`, not
#   `gen_fuzz_corpus.py check`) notices its absence.
# * `cargo fuzz` runs from the **repository root**, never from inside `fuzz/`. Its fuzz directory is
#   `<the cargo package it finds from the working directory>/fuzz`; the marker is what lets a run started
#   inside `fuzz/` walk back up to the root instead of looking for `fuzz/fuzz/Cargo.toml` and reporting a
#   target that is committed as missing, but every other path a step writes — the seed copy,
#   `fuzz/artifacts/<target>` below — is written from the root anyway. From the root, cargo-fuzz's default
#   layout is exactly what this repository commits: manifest `fuzz/Cargo.toml`, targets
#   `fuzz/fuzz_targets/<target>.rs`, corpus `fuzz/corpus/<target>/` and artefacts `fuzz/artifacts/<target>/`.
#   The seeds therefore need no moving; what they need is a *copy*, because the fuzzer writes into the
#   directory it is given (see `Seeding a run` in `fuzz/README.md`).
#

name: fuzz

on:
  schedule:
    # 03:17 UTC, every day. A prime-ish minute so the run does not collide with the hour's traffic.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per target"
        required: false
        default: "30"

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  nightly:
    name: 30 minutes (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [lockfile, hooks, paths]
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - name: Install nightly (libFuzzer needs -Zsanitizer)
        run: rustup toolchain install nightly --profile minimal --component llvm-tools
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Minutes per target
        id: minutes
        run: echo "value=${{ inputs.minutes || '30' }}" >> "$GITHUB_OUTPUT"
      - name: The committed corpus is the generated one
        run: python3 tools/gen_fuzz_corpus.py check
      - name: Seed the corpus cargo-fuzz will run
        # The same scratch copy as the smoke job, for the same reason.
        run: |
          mkdir -p "$RUNNER_TEMP/seeds"
          cp -R fuzz/corpus/. "$RUNNER_TEMP/seeds/"
      - name: Build the targets
        run: cargo +nightly fuzz build ${{ matrix.target }}
      - name: Fuzz
        # Two things this had wrong, both of which turn a nightly into a red one with no crash reported.
        # A step output is `steps.<id>.outputs.<name>`; `steps.<id>.<name>` is not an error in an
        # expression, it is silently the empty string, and the empty string then reaches `$(( … ))`.
        # And a `run: >-` block folds onto ONE line, so `total_time=… cargo fuzz run …` was a command
        # prefix that set `total_time` for `cargo` while `$total_time` still expanded, in the same breath,
        # to nothing — `-max_total_time=`, which libFuzzer reads as its own default. A `|` block, and the
        # assignment on its own line, is the spelling that means what it says.
        run: |
          total_time=$(( ${{ steps.minutes.outputs.value }} * 60 ))
          echo "fuzzing ${{ matrix.target }} for ${total_time}s"
          cargo +nightly fuzz run ${{ matrix.target }} "$RUNNER_TEMP/seeds/${{ matrix.target }}" -- \
            "-max_total_time=$total_time" -rss_limit_mb=4096 -timeout=25 -error_exitcode=86
      - name: Keep the artefacts if it crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nightly-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
