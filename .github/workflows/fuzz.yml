# Fuzzing: the readers that take repository content, driven with bytes nobody wrote (`e7.8`, `reco-41a`).
#
# Two cadences, because one cadence is always the wrong one:
#
# * **pull_request — a smoke.** One minute per target on a seed corpus of ~50 shapes. Long enough to catch
#   "this change made a parser crash on a shape we already had", short enough that nobody learns to ignore
#   the job. This is the half of the acceptance criterion that runs on the pull.
# * **nightly — the 30-minute run.** Thirty minutes per target, on a matrix so the wall clock stays inside
#   a nightly's budget. This is the "30-minute smoke runs in CI" the ticket asks for, and the run that finds
#   the shape no seed contained.
#
# The corpus grows in only one direction: a crash artefact becomes a regression test in
# `crates/fathom-analyze/tests/hardening.rs` (or `…/fathom-ingest/tests/hooks_hardening.rs`) and, if it is a
# *shape* rather than a one-off byte sequence, a new seed in `tools/gen_fuzz_corpus.py`. Committing raw
# artefacts into `fuzz/corpus/` would make `python3 tools/gen_fuzz_corpus.py check` — the gate that keeps the
# corpus reproducible — false.
#
# Nightly toolchain, and only here: libFuzzer is `-Zsanitizer`, which stable cannot pass. The main workspace
# stays on the pinned stable toolchain precisely so that `cargo build --workspace` remains a promise a clean
# clone can keep (`fuzz/Cargo.toml` explains the separate workspace).
#
# One rule that is easy to get wrong: `cargo fuzz` runs from the **repository root**, never from inside
# `fuzz/`. Its fuzz directory is `<the cargo package it finds from the working directory>/fuzz`, so run
# from `fuzz/` it goes looking for `fuzz/fuzz/Cargo.toml` and `fuzz/fuzz/fuzz_targets/`, finds neither, and
# says "no fuzz target by the name(s): 'lockfile'" — which reads like a missing target and is really a
# missing level of the path. From the root, cargo-fuzz's default layout is exactly what this repository
# commits: manifest `fuzz/Cargo.toml`, targets `fuzz/fuzz_targets/<target>.rs`, corpus
# `fuzz/corpus/<target>/` and artefacts `fuzz/artifacts/<target>/`. The seeds therefore need no moving; what
# they need is a *copy*, because the fuzzer writes into the directory it is given (see `Seeding a run` in
# `fuzz/README.md`).
#

name: fuzz

on:
  pull_request:
    paths:
      - "crates/fathom-analyze/**"
      - "crates/fathom-ingest/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # 03:17 UTC, every day. A prime-ish minute so the run does not collide with the hour's traffic.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per target"
        required: false
        default: "30"

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  smoke:
    name: smoke (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [lockfile, hooks, paths]
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - name: Install nightly (libFuzzer needs -Zsanitizer)
        run: rustup toolchain install nightly --profile minimal --component llvm-tools
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: The committed corpus is the generated one
        run: python3 tools/gen_fuzz_corpus.py check
      - name: Seed the corpus cargo-fuzz will run
        # A copy, into a scratch directory, for the reason `fuzz/README.md` gives: the fuzzer appends what
        # it discovers to the directory it is pointed at, and a discovered byte sequence is not something
        # this repository reviews. Pointing it straight at `fuzz/corpus/<target>` would make a local run
        # dirty the committed corpus and turn `gen_fuzz_corpus.py check` red for the next person.
        run: |
          mkdir -p "$RUNNER_TEMP/seeds"
          cp -R fuzz/corpus/. "$RUNNER_TEMP/seeds/"
      - name: Build the targets
        run: cargo +nightly fuzz build --debug ${{ matrix.target }}
      - name: One minute per target
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} "$RUNNER_TEMP/seeds/${{ matrix.target }}" --
          -max_total_time=60 -rss_limit_mb=4096 -timeout=10 -error_exitcode=86
      - name: Keep the artefact if it crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  nightly:
    name: 30 minutes (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [lockfile, hooks, paths]
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - name: Install nightly (libFuzzer needs -Zsanitizer)
        run: rustup toolchain install nightly --profile minimal --component llvm-tools
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Minutes per target
        id: minutes
        run: echo "value=${{ inputs.minutes || '30' }}" >> "$GITHUB_OUTPUT"
      - name: The committed corpus is the generated one
        run: python3 tools/gen_fuzz_corpus.py check
      - name: Seed the corpus cargo-fuzz will run
        # The same scratch copy as the smoke job, for the same reason.
        run: |
          mkdir -p "$RUNNER_TEMP/seeds"
          cp -R fuzz/corpus/. "$RUNNER_TEMP/seeds/"
      - name: Build the targets
        run: cargo +nightly fuzz build ${{ matrix.target }}
      - name: Fuzz
        # Two things this had wrong, both of which turn a nightly into a red one with no crash reported.
        # A step output is `steps.<id>.outputs.<name>`; `steps.<id>.<name>` is not an error in an
        # expression, it is silently the empty string, and the empty string then reaches `$(( … ))`.
        # And a `run: >-` block folds onto ONE line, so `total_time=… cargo fuzz run …` was a command
        # prefix that set `total_time` for `cargo` while `$total_time` still expanded, in the same breath,
        # to nothing — `-max_total_time=`, which libFuzzer reads as its own default. A `|` block, and the
        # assignment on its own line, is the spelling that means what it says.
        run: |
          total_time=$(( ${{ steps.minutes.outputs.value }} * 60 ))
          echo "fuzzing ${{ matrix.target }} for ${total_time}s"
          cargo +nightly fuzz run ${{ matrix.target }} "$RUNNER_TEMP/seeds/${{ matrix.target }}" -- \
            "-max_total_time=$total_time" -rss_limit_mb=4096 -timeout=25 -error_exitcode=86
      - name: Keep the artefacts if it crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nightly-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
