# The ADR-002 §8.3 CI: build and test on linux, macOS and windows for every PR, with `fmt` and `clippy`
# as hard failures, cargo-deny over the lockfile, and the MSRV floor built on the floor itself.
#
# Which ADR-002 rules this file is the enforcement of:
#
#   * §8.1's required-step list is a *checked* list: `tools/check_workspace.py check` (rule `C01`) fails
#     if any of these invocations disappears from `.github/workflows/*.yml`, and rule `T07` fails if the
#     `MSRV` pin below disagrees with the number in `tools/workspace_model.py`. One number, in the model.
#   * §2's supported window: `stable` and the MSRV both build; `beta` runs and is allowed to fail, so a
#     regression is known before it ships rather than in the week after.
#   * §6.1: a feature-less library build and the headless `minimal` binary are valid configurations, so
#     they are built and tested, on three operating systems, rather than assumed.
#
# `e0.7` (reco-e77) folded `contracts.yml`'s placeholder `rust` job into this matrix, as that file's own
# comment allowed; no step was dropped — `contracts.yml` still runs the docs/workspace gates, this file
# runs the Rust ones.
#
# One trap worth naming, because it silently neuters a matrix: `rust-toolchain.toml` pins the MSRV for
# local builds (ADR-002 §2), and a toolchain file outranks `rustup default`. Every leg below therefore
# states its toolchain through `RUSTUP_TOOLCHAIN`, which outranks the file. Without that, all three
# operating systems would quietly test one compiler.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# ADR-002 §8: everything here is a gate, so nothing here needs write access. `cargo-dist` asks for its
# own, narrower permissions in `release.yml`.
permissions:
  contents: read

env:
  # ADR-002 §2. `tools/check_workspace.py check` fails (`T07`) if this and the model ever disagree.
  MSRV: "1.97.0"
  CARGO_TERM_COLOR: always
  # Shared between the vendored C builds (bundled SQLite, six tree-sitter grammars) and the cache;
  # incremental state is not worth its disk cost on a runner that builds once.
  CARGO_INCREMENTAL: "0"

jobs:
  # ---------------------------------------------------------------------------
  # The two hard style gates, on one runner: they cost a minute and save a re-run of the whole matrix.
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt (rustfmt)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all --check
        # A hard failure, per §8.3 and the §2 table. Formatting stops being a matter of opinion the day
        # it is not a matter of conversation.
        run: cargo fmt --all --check

  clippy:
    name: clippy (strict)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The shipped code may not unwrap; tests may. Two invocations, in this order, because the strict
      # one is what would otherwise get lost under `--all-targets` (§8.3). The second one also stops
      # `print_stdout` — a bench or golden test whose *output is the artefact* (`timeline_bench`,
      # `deps_bench`, the corpus goldens) has to print, and the lint exists to keep a stray `println!`
      # out of the shipped binary, where stdout is the user's. Silence about the tests is not what the
      # lint promised, so the exemption is stated in the invocation rather than paid for file by file.
      - name: clippy (libs and bins: unwrap_used and expect_used are errors)
        run: >
          cargo clippy --workspace --all-features -- -D warnings
          -D clippy::unwrap_used -D clippy::expect_used
      - name: clippy (all targets: tests may unwrap, and tests may print)
        run: >
          cargo clippy --workspace --all-targets -- -D warnings
          -A clippy::print_stdout

  structure-spike:
    name: spike s1 reproduces (six grammars)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: "spike s1: the committed accuracy report reproduces"
        # Spike `s1` (`reco-alj`) decided which tree-sitter grammars ship (ADR-002 §6.5) and what
        # each language's fallback is (docs/concepts/structure-extraction.md). The report is a
        # measurement, so CI re-measures it: relation counts and verdicts must match the committed
        # report exactly. Throughput is excluded on purpose — a busy runner is not a regression —
        # and the debug profile is allowed because `--check` never writes the file it audits.
        run: >
          cargo run --locked -p fathom-analyze --features langs-all --example s1_spike --
          --repo . --report benchmarks/reports/s1-tree-sitter-accuracy.json --check
      - name: "spike s1: the harness itself builds with every grammar"
        run: cargo build --locked -p fathom-analyze --features langs-all --all-targets

  structure-core:
    name: structural extractor core reproduces (three languages)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: "e3.1: the committed accuracy-and-mechanism report reproduces"
        # `e3.1` (`reco-zoz`) is the extractor spike `s1` decided the shape of. `--check` compares
        # every relation count, the four mechanism checks (synthetic scopes, wildcard edges, the
        # resolution bound including the forced-one-pass demonstration, and the fallback battery)
        # and the verdicts, and never throughput: a busy runner is not a regression, and a debug
        # build measures the borrow checker rather than the grammar.
        run: >
          cargo run --locked -p fathom-analyze --features lang-rust,lang-python,lang-typescript
          --example structure_harness -- --repo .
          --report benchmarks/reports/e3-1-structure-core.json --check
      - name: "e3.1: the byte contract and the corpus properties"
        # The golden canonical-JSON file (AC 6) and the model properties. Gated behind the three
        # grammars in `Cargo.toml`, so this step names them; a default `cargo test` does not pay for
        # three C builds it was never asked to exercise (ADR-002 §6.5).
        run: >
          cargo test --locked -p fathom-analyze
          --features lang-rust,lang-python,lang-typescript --test structure_core
      - name: "e3.1: the harness builds with every grammar `e3.1b` will need"
        run: cargo build --locked -p fathom-analyze --features langs-all --example structure_harness

  g3-calibration:
    name: Guardrail 3 calibration reproduces (three real repositories)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch the pinned corpus
        # The clones are not checked in — they are other people's history, and the repository is not
        # allowed to be the place their commits are warehoused. `corpus/*/pin.json` is the artifact and
        # the fetcher re-materialises it, refusing a remote that returns anything but the pinned oid.
        # `--check` separately fails loudly when a pin can no longer be fetched at all, which is the
        # difference between a corpus that expired and a measurement that quietly stopped existing.
        run: |
          python3 tools/fetch_g3_corpus.py
          python3 tools/fetch_g3_corpus.py --check
      - name: "G3, the miss rate and every gate reproduce from the corpus and the shipped code"
        # Spike `e4.9` (`reco-mkl.1`) is what `e4.3` and `m1` defer to for "the threshold agreed in
        # `e0.12`" (ADR-001 §5.4), so the number is only a gate if CI can re-measure it: the score and
        # the findings come from the shipped code, the dispositions from the hand-authored truth files,
        # and `--check` refuses a byte of difference in the committed report or a gate that came out
        # other than its declared `expected`. See docs/concepts/false-positive-calibration.md.
        run: >
          cargo run --locked -p fathom-analyze --features sqlite-bundled --example g3_calibration --
          --root . --check

  deny:
    name: cargo-deny (licences, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same discipline in Python (§8.4): a `deny.toml` whose suppressions are unsigned fails even on
      # a day the advisory database fetch is having trouble.
      - name: deny.toml's own rules (D01-D08)
        run: python3 tools/check_workspace.py lint

  # The release skeleton is generated from `dist-workspace.toml`; this job is what stops the generated
  # workflow and the config it came from from drifting apart, which is the same argument §8.4 makes about
  # a hand-edited `deny.toml` and ADR-002's generated tables make about hand-copied tables. The second
  # step is the rest of the release path (`m0`/`reco-n1j`): the three operating systems still being
  # covered, both installers still existing, one version in one place, the changelog section that *is*
  # the release body, README quoting the URL the installers bake, and the captured plan still describing
  # the config. `dist generate --check` compares a workflow to its config; `check_release.py` compares
  # the release to what its users are told, and needs neither `dist` nor a network.
  release-skeleton:
    name: release skeleton matches dist-workspace.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: axodotdev/cargo-dist/action@v1
        with:
          command: generate
          arguments: --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The release path (R01-R12)
        run: python3 tools/check_release.py

  # ---------------------------------------------------------------------------
  # The matrix: three operating systems × {stable, MSRV}, per §8.3.
  # ---------------------------------------------------------------------------
  build-test:
    name: build+test (${{ matrix.os }} · ${{ matrix.channel }})
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        channel: [stable, msrv]
        include:
          - channel: stable
            toolchain: stable
          - channel: msrv
            toolchain: "1.97.0"
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: install the pinned toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy,rustfmt
      - name: toolchain
        run: rustc -vV && cargo --version

      # Everything, with every published feature, on stable: this is the build the artefacts come from.
      - name: build (everything, all features)
        if: matrix.channel == 'stable'
        run: cargo build --workspace --all-features

      - name: test (everything, all features)
        if: matrix.channel == 'stable'
        run: cargo test --workspace --all-features

      # Spike `s2`'s report is the artifact ADR-003 §18 quotes and `tests/test_segmentation_spike_contract.py`
      # asserts against; the harness scores its `shipped` strategy with `fathom_ingest::segment` itself and
      # then refuses to write a report that differs from the corpus byte-for-byte. Same claim, here rather
      # than in the contracts job, because it needs the workspace built.
      - name: "spike s2: the committed segmentation report reproduces"
        if: matrix.channel == 'stable'
        run: cargo run -q -p fathom-analyze --example s2_spike -- --check

      # The headless CI-gate binary `e6.6` puts inside pipelines (§6.1), built on both channels: a
      # TUI-only test suite would never notice that `fathom check` had grown a dependency on a terminal.
      - name: build the headless `minimal` binary
        run: cargo build -p fathom-cli --no-default-features --features minimal

      - name: test the headless configuration
        run: cargo test -p fathom-cli --no-default-features --features minimal

      # The MSRV floor, on the floor (§2): "a dependency that needs newer Rust is discovered locally, not
      # by a user" — and locally means here, for the ones who do not read this file.
      - name: build on the declared MSRV
        if: matrix.channel == 'msrv'
        run: cargo +$MSRV build --workspace --no-default-features --features minimal

      # `e7.5` (reco-60m): the CLI reference page is generated from the binary's own `--help`, so CI is
      # what keeps it from lying about a flag. It runs here rather than in `contracts.yml` because its
      # source is a compiled program, and on the linux/stable leg because that is the leg whose build the
      # committed page was written from. clap's argument tree is feature-independent in this workspace — no
      # `#[arg]` in `verbs.rs` sits behind a `#[cfg(feature = …)]`, so the `--all-features` build this leg
      # already produced renders the same help as the default one. If a feature-gated flag is ever added,
      # this step changes to `cargo build -p fathom-cli` and the comment says why.
      - name: "e7.5 docs: the CLI reference is the binary's own --help, and every documented command types"
        if: matrix.channel == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          python3 tools/gen_docs.py check --page cli
          python3 tools/check_docs_site.py

      - name: the binary answers, on every platform
        run: |
          cargo build -p fathom-cli --no-default-features --features minimal
          ./target/debug/fathom --version
          ./target/debug/fathom --help
          ./target/debug/fathom doctor --privacy

      # §6: the default build links no network-capable crate. A list, not a shrug — if one appears the job
      # says which, and `tools/check_workspace.py shipped` prints the same closure from the model.
      - name: default binary links zero network-capable crates
        if: matrix.channel == 'stable'
        run: |
          cargo tree -p fathom-cli --no-default-features --features minimal -e normal --prefix none \
            | awk '{print $1}' | sort -u > /tmp/deps.txt
          for banned in reqwest ureq hyper rustls native-tls openssl-sys git2 libgit2-sys axum; do
            if grep -qx "$banned" /tmp/deps.txt; then
              echo "::error::default build links $banned — ADR-002 R6"; exit 1
            fi
          done

  # §2's third channel: known before it ships, rather than in the week after.
  beta:
    name: beta (allowed to fail)
    needs: [fmt, clippy]
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: install beta
        run: rustup toolchain install beta --profile minimal
      - name: build (everything, on beta)
        run: cargo build --workspace --all-features
      - name: test (everything, on beta)
        run: cargo test --workspace --all-features
