# The ADR-002 §8.3 CI: build and test on linux, macOS and windows for every PR, with `fmt` and `clippy`
# as hard failures, cargo-deny over the lockfile, and the MSRV floor built on the floor itself.
#
# Which ADR-002 rules this file is the enforcement of:
#
#   * §8.1's required-step list is a *checked* list: `tools/check_workspace.py check` (rule `C01`) fails
#     if any of these invocations disappears from `.github/workflows/*.yml`, and rule `T07` fails if the
#     `MSRV` pin below disagrees with the number in `tools/workspace_model.py`. One number, in the model.
#   * §2's supported window: `stable` and the MSRV both build; `beta` runs and is allowed to fail, so a
#     regression is known before it ships rather than in the week after.
#   * §6.1: a feature-less library build and the headless `minimal` binary are valid configurations, so
#     they are built and tested, on three operating systems, rather than assumed.
#
# `e0.7` (reco-e77) folded `contracts.yml`'s placeholder `rust` job into this matrix, as that file's own
# comment allowed; no step was dropped — `contracts.yml` still runs the docs/workspace gates, this file
# runs the Rust ones.
#
# One trap worth naming, because it silently neuters a matrix: `rust-toolchain.toml` pins the MSRV for
# local builds (ADR-002 §2), and a toolchain file outranks `rustup default`. Every leg below therefore
# states its toolchain through `RUSTUP_TOOLCHAIN`, which outranks the file. Without that, all three
# operating systems would quietly test one compiler.

name: ci

on:
  pull_request:
  push:
    branches: [master]

# ADR-002 §8: everything here is a gate, so nothing here needs write access. `cargo-dist` asks for its
# own, narrower permissions in `release.yml`.
permissions:
  contents: read

env:
  # ADR-002 §2. `tools/check_workspace.py check` fails (`T07`) if this and the model ever disagree.
  MSRV: "1.97.0"
  CARGO_TERM_COLOR: always
  # Shared between the vendored C builds (bundled SQLite, six tree-sitter grammars) and the cache;
  # incremental state is not worth its disk cost on a runner that builds once.
  CARGO_INCREMENTAL: "0"

jobs:
  # ---------------------------------------------------------------------------
  # The two hard style gates, on one runner: they cost a minute and save a re-run of the whole matrix.
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt (rustfmt)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all --check
        # A hard failure, per §8.3 and the §2 table. Formatting stops being a matter of opinion the day
        # it is not a matter of conversation.
        run: cargo fmt --all --check

  clippy:
    name: clippy (strict)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Two invocations, in this order, because the strict one is what would otherwise get lost under
      # `--all-targets` (§8.3). The first compiles only the shipped code and denies `unwrap_used` and
      # `expect_used` there. The second adds tests, benches and examples — and it does **not** re-deny
      # those two, because `[workspace.lints]` already declares them `warn` and `-D warnings` promotes
      # every warning anyway: the two lints are live in this invocation too, and that is deliberate. What
      # says "a test may unwrap" is the test file, with the `#![allow(clippy::unwrap_used,
      # clippy::expect_used)]` every test file in this workspace carries — the claim belongs next to the
      # code making it, where a new test file has to make it too. The one exemption stated here is
      # `print_stdout`: a bench or golden test whose *output is the artefact* (`timeline_bench`,
      # `deps_bench`, the corpus goldens) has to print, and there is no reason to ask forty files to say
      # so. A test file that fails this step is a test file that forgot its own line, and the fix is that
      # line — not an `-A` here, which would silence the claim for every file at once.
      - name: clippy libs and bins unwrap_used and expect_used are errors
        run: >-
          cargo clippy --workspace --all-features --
          -D warnings -D clippy::unwrap_used -D clippy::expect_used

      - name: clippy all targets tests say for themselves that they may unwrap; none may print
        run: >-
          cargo clippy --workspace --all-targets --
          -D warnings -A clippy::print_stdout

  structure-spike:
    name: spike s1 reproduces (six grammars)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: "spike s1: the committed accuracy report reproduces"
        # Spike `s1` (`reco-alj`) decided which tree-sitter grammars ship (ADR-002 §6.5) and what
        # each language's fallback is (docs/concepts/structure-extraction.md). The report is a
        # measurement, so CI re-measures it: relation counts and verdicts must match the committed
        # report exactly. Throughput is excluded on purpose — a busy runner is not a regression —
        # and the debug profile is allowed because `--check` never writes the file it audits.
        run: >
          cargo run --locked -p fathom-analyze --features langs-all --example s1_spike --
          --repo . --report benchmarks/reports/s1-tree-sitter-accuracy.json --check
      - name: "spike s1: the harness itself builds with every grammar"
        # `sqlite-bundled` is here because `--all-targets` means *every* target, and `tests/graph_index.rs`
        # drives the graph pass through `fathom_store`'s SQLite backend (`spine::Store`, `graph::…`,
        # `Availability::probe`), which §6.2 gates behind a store feature. A build of the library alone has
        # no opinion about it; a build of the test suite without one fails to compile, and the honest fix is
        # to say which features the targets need rather than to drop the target from the claim.
        run: cargo build --locked -p fathom-analyze --features langs-all,sqlite-bundled --all-targets

  structure-core:
    name: structural extractor core and tail reproduce (six languages)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: "e3.1: the committed accuracy-and-mechanism report reproduces"
        # `e3.1` (`reco-zoz`) is the extractor spike `s1` decided the shape of. `--check` compares
        # every relation count, the four mechanism checks (synthetic scopes, wildcard edges, the
        # resolution bound including the forced-one-pass demonstration, and the fallback battery)
        # and the verdicts, and never throughput: a busy runner is not a regression, and a debug
        # build measures the borrow checker rather than the grammar.
        # `e3.1b` (`reco-dlp.1`) added Go, Ruby and Java to the same harness and the same report, so
        # `--check` now needs all six grammars: a report with six languages cannot be reproduced by a
        # build that speaks three, and the answer to that is not to compare three of them.
        run: >
          cargo run --locked -p fathom-analyze --features langs-all
          --example structure_harness -- --repo .
          --report benchmarks/reports/e3-1-structure-core.json --check
      - name: "e3.1: the byte contract and the corpus properties"
        # The golden canonical-JSON file (AC 6) and the model properties. Gated behind the three
        # grammars in `Cargo.toml`, so this step names them; a default `cargo test` does not pay for
        # three C builds it was never asked to exercise (ADR-002 §6.5).
        run: >
          cargo test --locked -p fathom-analyze
          --features lang-rust,lang-python,lang-typescript --test structure_core
      - name: "e3.1b: the tail contract — go granularity, the ruby scan budget, the java same-package budget"
        # The three things `e3.1b` added, each asserted against the report and against `thresholds.json`
        # rather than against a paragraph: package-granular Go edges, the Ruby per-run scan budget and the
        # Java same-package false-positive budget.
        run: >
          cargo test --locked -p fathom-analyze
          --features langs-all --test structure_tail
      - name: "e3.1b: the harness builds with every grammar, including the three corpora generators"
        # Same `sqlite-bundled` as the `spike s1` leg above: `--all-targets` compiles `tests/graph_index.rs`,
        # and that target needs a store backend to compile at all.
        run: cargo build --locked -p fathom-analyze --features langs-all,sqlite-bundled --all-targets

  g3-calibration:
    name: Guardrail 3 calibration reproduces (three real repositories)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch the pinned corpus
        # The clones are not checked in — they are other people's history, and the repository is not
        # allowed to be the place their commits are warehoused. `corpus/*/pin.json` is the artifact and
        # the fetcher re-materialises it, refusing a remote that returns anything but the pinned oid.
        # `--check` separately fails loudly when a pin can no longer be fetched at all, which is the
        # difference between a corpus that expired and a measurement that quietly stopped existing.
        run: |
          python3 tools/fetch_g3_corpus.py
          python3 tools/fetch_g3_corpus.py --check
      - name: "G3, the miss rate and every gate reproduce from the corpus and the shipped code"
        # Spike `e4.9` (`reco-mkl.1`) is what `e4.3` and `m1` defer to for "the threshold agreed in
        # `e0.12`" (ADR-001 §5.4), so the number is only a gate if CI can re-measure it: the score and
        # the findings come from the shipped code, the dispositions from the hand-authored truth files,
        # and `--check` refuses a byte of difference in the committed report or a gate that came out
        # other than its declared `expected`. See docs/concepts/false-positive-calibration.md.
        run: >
          cargo run --locked -p fathom-analyze --features sqlite-bundled --example g3_calibration --
          --root . --check

  deny:
    name: cargo-deny (licences, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same discipline in Python (§8.4): a `deny.toml` whose suppressions are unsigned fails even on
      # a day the advisory database fetch is having trouble.
      - name: deny.toml's own rules (D01-D08)
        run: python3 tools/check_workspace.py lint

  # The release skeleton is generated from `dist-workspace.toml`; this job is what stops the generated
  # workflow and the config it came from from drifting apart, which is the same argument §8.4 makes about
  # a hand-edited `deny.toml` and ADR-002's generated tables make about hand-copied tables. `dist generate
  # --check` compares a workflow to its config; there is no `axodotdev/cargo-dist/action` to `uses:` for
  # it — the action path an earlier revision of this file named has never existed in that repository, and
  # the job died in "Set up job", before one step of its own had run, which is the least legible way for a
  # gate to be red. `cargo-dist` ships an installer, not an action: this is the same one `release.yml`
  # runs (that file is generated, and it bakes the pinned version into the URL) and the same one the
  # `packaging` job below runs, and here the version is read out of `dist-workspace.toml` rather than
  # copied, so there is one pin.
  #
  # The rest of the job is the release path (`m0`/`reco-n1j`, extended by `e7.4`/`reco-3q4`): the three
  # operating systems still being covered, the installers still existing (both scripts, the msi, the
  # formula), the msi's `upgrade-guid` surviving, the system packages being named for the version being
  # released, the completions and man pages being `include`d, the document still saying which steps need a
  # maintainer-only secret, one version in one place, the changelog section that *is* the release body, and
  # README quoting the URL the installers bake. `check_release.py` compares the release to what its users
  # are told, and needs neither `dist` nor a network.
  #
  # The third and fourth steps are the version bump's own rules (`P01`-`P08` in `tools/release.py`): the
  # seven places the one version has to arrive, checked offline, and the proof that those checks can fail.
  # `check` is the aggregate CI cares about (a version in six of seven places is a red build, not a shrug);
  # `self-test` is why it is trusted. This greenness is load-bearing beyond the pull request:
  # `.github/workflows/publish.yml` cuts a release from the commit this job goes green on, so a version
  # that only half-moved never reaches a tag.
  release-skeleton:
    name: release skeleton matches dist-workspace.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install cargo-dist (pinned to dist-workspace.toml)
        run: |
          dist_version=$(python3 -c 'import tomllib; print(tomllib.load(open("dist-workspace.toml","rb"))["dist"]["cargo-dist-version"])')
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${dist_version}/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: dist generate --check (the workflow and the msi template are their config's output)
        # Both generated files, not just the workflow: `dist generate` writes `crates/fathom-cli/wix/main.wxs`
        # too, and a hand-touched `main.wxs` fails `dist plan` in `release.yml` — the whole release pipeline
        # refusing to start, from a whitespace difference nobody made. Checked here, on the pull request that
        # made it, rather than at the one moment it is expensive.
        run: dist generate --check
      - name: The release path (R01-R17)
        run: python3 tools/check_release.py
      - name: One version, seven places (P01-P08)
        run: python3 tools/release.py check
      - name: the version bump's negative controls
        run: python3 tools/release.py self-test
      # The packager needs no toolchain to prove its own rules: `--self-test` builds a throwaway tree in
      # a temp directory and requires its own corruptions to be refused — a stale artefact name in
      # `dist-workspace.toml`, a spec whose `%files` list has a relative entry (**reco-ndf**), and one that
      # claims a file nothing staged.
      - name: the .deb/.rpm packager's negative controls
        run: python3 tools/package_release.py --self-test

  # ---------------------------------------------------------------------------
  # `e7.4` (`reco-3q4`): the packaging, and the install that consumes it. Three claims, in order of how
  # expensive each is to discover wrong:
  #
  #   1. the `.deb` is a `.deb` — written by hand here, so `dpkg-deb` (Debian's own reader) has to accept
  #      it, and `dpkg --install` has to put a working `fathom` on `PATH`; a control member with a wrong
  #      size "unpacks" happily and fails at configure time, which is the least legible way to be wrong;
  #   2. the curl installer's contract holds — right archive for the machine, digest verified, version
  #      right — against a local mirror, which is the only way to test it before there is a release;
  #   3. the completions and man pages committed under `packaging/` are what the binary prints, byte for
  #      byte (checked in the docs leg, where the binary is already built).
  #
  # Runs on ubuntu-latest because `rpmbuild` is installable there (the packager installs it) and because
  # the archive for this runner's triple is one `dist build` away.
  # ---------------------------------------------------------------------------
  packaging:
    name: packaging (deb, rpm, and the installer that fetches them)
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same installer the release workflow uses, so the rehearsal exercises a `dist` of the pinned
      # version rather than whatever is convenient — and the pin is read from `dist-workspace.toml` rather
      # than copied, so this step cannot drift from the file that names the version.
      - name: install cargo-dist (pinned to dist-workspace.toml)
        run: |
          dist_version=$(python3 -c 'import tomllib; print(tomllib.load(open("dist-workspace.toml","rb"))["dist"]["cargo-dist-version"])')
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${dist_version}/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: cargo build (release, the profile the artefacts come from)
        run: cargo build --release -p fathom-cli --locked
      # The archive for this runner's own triple — what a `.deb` is repacked from. Not `--artifacts=all`:
      # the complete release set is six targets and one runner is not six machines, and the global phase
      # would then insist on `.deb`s for an architecture this job never built (which is right, and is why
      # the installer rehearsal below runs with that stage lifted out).
      #
      # `--target` is not optional here. `--artifacts=local` with no `--target` does not mean "this
      # machine's archive" to `dist`, it means "every triple in `dist-workspace.toml`" — the same reading
      # that makes `--artifacts=global` mean the whole release — so the job died with
      # `Cross-compilation from x86_64-unknown-linux-gnu to aarch64-apple-darwin is not supported`
      # (`reco-hzr`) while trying to make a Mach-O on a Linux runner. The triple is asked of the compiler
      # rather than written down, so the step names the machine it is actually on instead of assuming
      # `ubuntu-latest` stays x86_64; `rule D01` of `tools/check_workflows.py` is what keeps it stated.
      - name: dist build (this runner's archive)
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          echo "building this runner's own archive for ${triple}"
          dist build --artifacts=local --target="${triple}"
      - name: the installer rehearsal, and its negative controls
        run: |
          python3 tools/rehearse_installer.py --no-extra-artifacts
          python3 tools/rehearse_installer.py --skip-build --self-test
      - name: the packager's own rules (its negative controls)
        run: python3 tools/package_release.py --self-test
      # The archive dist just made, repacked — and read back in the same step: `--verify` runs `dpkg-deb
      # --info/--contents` and `rpm -qp`/`rpm -qlp` over what was just written, so a package that builds
      # but installs its files in the wrong place (or, as in **reco-ndf**, does not build at all) fails
      # here instead of three steps later on somebody else's `dpkg -i`.
      - name: build the system packages from the archive dist just made
        run: python3 tools/package_release.py --verify
      # Debian's own reader, then Debian's own installer: the file has to survive both, and the binary it
      # lays down has to be the one the manifest says. `0.1.0-alpha.1` is the version `dpkg` sees as
      # `0.1.0~alpha.1`, because `-` is not legal in an upstream version.
      - name: install the .deb the way a user would, and run what it put on PATH
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          pkg="target/packaging/fathom_${version/-/\~}_amd64.deb"
          test -f "$pkg" || { echo "no $pkg"; exit 1; }
          dpkg-deb --show "$pkg"
          contents=$(dpkg-deb --contents "$pkg")
          grep -q 'usr/share/man/man1/fathom.1.gz' <<< "$contents"
          grep -q 'usr/share/bash-completion/completions/fathom' <<< "$contents"
          #dpkg-deb --show "$pkg"
          #dpkg-deb --contents "$pkg" | grep -q 'usr/share/man/man1/fathom.1.gz'
          #dpkg-deb --contents "$pkg" | grep -q 'usr/share/bash-completion/completions/fathom'
          sudo dpkg --install "$pkg"
          test "$(fathom --version | head -1 | awk '{print $2}')" = "$version"
      - name: read the .rpm with rpm's own reader
        run: rpm -qip target/packaging/fathom-*.rpm

  # ---------------------------------------------------------------------------
  # `e6.6` (`reco-ngk`): the gate runs as a gate. The point of this job is not that `fathom check` finds
  # nothing on `main` — `fathom.toml` declares `[check] mode = "warn"`, so it could not block even if it did,
  # and **reco-azy** is the ticket that decided it stays that way for now (its `[check]` block carries the
  # measurement, the reason and the order of conditions that turn it to `deny`). The point is the
  # three claims the ticket made about the *run*: it finishes inside a minute on a medium repository with a
  # shallow clone, its SARIF uploads cleanly, and its exit code is the contract the next verb inherits.
  #
  # What `warn` cannot decide is decided here instead, in the JSON step below: a gate that never looked.
  # ---------------------------------------------------------------------------
  check-gate:
    name: check-gate (the CI gate, on its own repository)
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      # A shallow clone, deliberately: the gate's `fetch-depth: 0` advice has to be true, and one of the
      # six checks is only interesting when the base is missing. 50 is the depth a busy repository would
      # use, and this repository's history is short enough that the range is still real.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: Swatinem/rust-cache@v2
      - name: build the headless binary the gate ships as
        # `minimal` would silently block four of the six checks for a missing store; the headless CI build
        # is the one with every check wired. No `net-*` feature, so the "runs without network" clause is
        # at least not contradicted by the build.
        run: cargo build --locked -p fathom-cli --no-default-features --features sqlite-bundled,langs-all,deps-all
      - name: index
        run: ./target/debug/fathom index --no-progress --json | tail -1

      # The budget, timed rather than asserted in a test: a fixture of forty synthetic commits is the floor
      # of the claim, and this is the ceiling. The first run is the gate — its log is the job's own output,
      # its `::error`/`::warning` lines are the diff annotations, and because the runner set
      # `$GITHUB_STEP_SUMMARY` its markdown job summary is appended in the same pass. The second run is the
      # artefact a code-scanning uploader consumes, and it says `--no-summary` because a run whose purpose
      # is a file should not also write prose.
      - name: the gate, timed against the 60s budget
        run: |
          base="$(git rev-parse HEAD~5 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
          start=$(date +%s)
          set +e
          ./target/debug/fathom check --base "$base" --head HEAD
          gate=$?
          ./target/debug/fathom check --base "$base" --head HEAD \
            --format sarif --out fathom.sarif --no-summary
          sarif=$?
          set -e
          took=$(( $(date +%s) - start ))
          echo "two runs (the gate, then the SARIF) over $base..HEAD took ${took}s"
          # Two runs, so twice the single-run figure the criterion names. The wall clock is the only honest
          # measurement of it, which is why it is measured here and not merely asserted in a fixture.
          if [ "$took" -ge 120 ]; then
            echo "::error::fathom check took ${took}s for two runs; the budget is 60s each"
            exit 1
          fi
          # `7` is a finding, and `[check] mode = warn` — declared in `fathom.toml`, argued in **reco-azy** —
          # means it is not this job's failure. Anything else — a crash, a store it could not open, a policy
          # it could not read — is, because the gate itself broke, which is the one outcome ADR-002 §7.3
          # refuses to let a pipeline call "red". When this repository's mode becomes `deny`, the `0|7` below
          # is the line that has to change with it: until then this tolerance, not the mode, is what keeps the
          # gate advisory here.
          for pair in "gate:$gate" "sarif:$sarif"; do
            case "${pair#*:}" in
              0|7) ;;
              *) echo "::error::${pair%%:*} exited ${pair#*:} — expected 0 or 7"; exit 1 ;;
            esac
          done
      - name: the SARIF is a SARIF an uploader will take
        run: python3 tools/check_sarif.py fathom.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fathom-check-sarif
          path: fathom.sarif
      - name: the JSON document is the contract it claims to be
        run: |
          ./target/debug/fathom check --base HEAD~5 --format json > /tmp/check.json
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "tools")
          value = json.loads(pathlib.Path("/tmp/check.json").read_text())
          schema = json.loads(pathlib.Path("schemas/check.schema.json").read_text())
          assert value["contract"] == schema["x-fathom-contract"], value["contract"]
          assert value["exit"] in (0, 7), value["exit"]
          assert value["checks"], "a run with no rows is not a run"
          for row in value["checks"]:
              if row["status"] == "ran":
                  assert row["examined"] is not None, row
              else:
                  assert row["examined"] is None, "a blocked row cannot have examined anything"
          print(f"fathom check: {value['outcome']}, {value['summary']['found']} finding(s), {len(value['checks'])} rows")

          # The half this repository's `mode = "warn"` cannot carry, asserted here because nothing else can.
          # In `warn` nothing at all decides an exit code — a run in which every check was blocked, or which
          # examined nothing, prints `fathom check failed` and exits 0 exactly like a clean one. So the
          # no-silent-passes half of ADR-002 §7.3 is a rule even while the volume is an opinion (`fathom.toml`
          # `[check] mode`, **reco-azy**): findings are this job's results, a gate that did not look is its
          # failure, and neither of them is decided by whoever reads the log that day.
          rows = {r["check"]: r["status"] for r in value["checks"]}
          blocked = sorted(k for k, s in rows.items() if s == "blocked")
          ran = sorted(k for k, s in rows.items() if s == "ran")
          assert not blocked, f"blocked check row(s) {blocked} — a check that could not judge is not a pass"
          assert not value["summary"]["blocked_required"], value["summary"]["blocked_required"]
          assert ran, f"no check ran at all: {rows}"
          print(f"and every row judged the range: {', '.join(ran)}")
          PY
      - name: and the gate's own test suite
        run: cargo test --locked -p fathom-cli --no-default-features --features sqlite-bundled,langs-all,deps-all --test check_verb

  # ---------------------------------------------------------------------------
  # The extensibility criterion, as a build (`e6.7`, `reco-raw`): the example plugin is a *second
  # workspace*, excluded from the root one, that depends on `fathom-analyze` the way a third party's
  # manifest does. Nothing else in this file catches a plugin API that only works from inside the
  # workspace it lives in — a `pub(crate)` that leaked, a type a plugin cannot name, a helper that is
  # actually a private path dependency. Here it fails as a stranger fails.
  #
  # It is its own job rather than a step in the matrix because the criterion is about the *boundary*, and a
  # boundary check that only runs after a nine-minute build is a boundary check that nobody reads.
  # ---------------------------------------------------------------------------
  out-of-tree-plugin:
    name: out-of-tree-plugin (the example plugin builds and runs against the published crate)
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # The root workspace, for the `fathom-cli` build at the end of the job.
          workspaces: .
      - uses: Swatinem/rust-cache@v2
        with:
          # And its own: its own lock file, its own target directory, its own cache. The point of the job is
          # that this is not the root workspace.
          workspaces: plugins/acme-detectors
      - name: and lint it under its own lint set
        # Its own `#![warn]` list, not the workspace's — see `plugins/acme-detectors/Cargo.toml`. A third
        # party's code style is its own business; what the job checks is that it is not silently broken.
        run: cargo clippy --manifest-path plugins/acme-detectors/Cargo.toml --all-targets -- -D warnings
      - name: build and test the plugin in its own workspace
        run: cargo test --manifest-path plugins/acme-detectors/Cargo.toml
      - name: run it the way a reviewer does — a delta document in, findings out
        run: |
          cargo run --quiet --manifest-path plugins/acme-detectors/Cargo.toml -- --list
          cargo run --quiet --manifest-path plugins/acme-detectors/Cargo.toml --             --delta plugins/acme-detectors/fixtures/miniature.json             --check plugins/acme-detectors/fixtures/miniature.expected.jsonl
      - name: and refuse a document that is not a delta document, with a sentence that says so
        # The pipeline's failure mode: `fathom analyze` printed an error instead of a document, and the
        # plugin's stderr is the only thing the reviewer will read.
        run: |
          if echo 'not a delta document' | cargo run --quiet --manifest-path plugins/acme-detectors/Cargo.toml --; then
            echo "the plugin accepted a document that is not one" >&2; exit 1
          fi
      - name: and against a delta document the freshly built binary printed, byte for byte
        # The fixture above is a checked-in document, which is the right thing for a unit test and the wrong
        # thing for the acceptance criterion. This is the criterion: the *product's own* published document,
        # printed by the binary built from this checkout, put on the plugin's stdin in a shell pipeline,
        # yields the findings the plugin is blessed to yield. `--demo` is the miniature repository embedded
        # in the binary (`assets/fathom-demo.pack`), so this needs no network and no fixture repository.
        run: |
          cargo build --locked -p fathom-cli
          cargo run --quiet -p fathom-cli -- --demo analyze ep-7090b6693637812919bd --json 2>/dev/null \
            | cargo run --quiet --manifest-path plugins/acme-detectors/Cargo.toml -- --json \
                --check plugins/acme-detectors/fixtures/miniature.expected.jsonl

  # ---------------------------------------------------------------------------
  # The matrix: three operating systems × {stable, MSRV}, per §8.3.
  # ---------------------------------------------------------------------------
  build-test:
    name: build+test (${{ matrix.os }} · ${{ matrix.channel }})
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        channel: [stable, msrv]
        include:
          - channel: stable
            toolchain: stable
          - channel: msrv
            toolchain: "1.97.0"
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    defaults:
      run:
        shell: bash
    steps:
      # Full history, because of the `e7.7 beta loop` step below: `tools/gen_changelog.py audit` asks what
      # every commit since the last release did for the release notes, and a depth-1 clone cannot answer —
      # the audit died in `git log` with "Invalid revision range" (`reco-ghao`). The history here is a few
      # hundred commits; this job's time goes on cargo, not on the clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - name: install the pinned toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy,rustfmt
      - name: toolchain
        run: rustc -vV && cargo --version

      # Everything, with every published feature, on stable: this is the build the artefacts come from.
      - name: build (everything, all features)
        if: matrix.channel == 'stable'
        run: cargo build --workspace --all-features

      - name: test (everything, all features)
        if: matrix.channel == 'stable'
        run: cargo test --workspace --all-features

      # Spike `s2`'s report is the artifact ADR-003 §18 quotes and `tests/test_segmentation_spike_contract.py`
      # asserts against; the harness scores its `shipped` strategy with `fathom_ingest::segment` itself and
      # then refuses to write a report that differs from the corpus byte-for-byte. Same claim, here rather
      # than in the contracts job, because it needs the workspace built.
      - name: "spike s2: the committed segmentation report reproduces"
        if: matrix.channel == 'stable'
        run: cargo run -q -p fathom-analyze --example s2_spike -- --check

      # Spike `s6` (`reco-f5a`) is the same claim about rewrites instead of boundaries: the committed report
      # in `benchmarks/reports/s6-relink-accuracy.json` must be what the relink corpus and the shipped
      # relink pass produce, and its gates must come out as declared. It needs the bundled SQLite because
      # the harness pins its own copy of §6.2's ladder against `fathom_store`'s on every event.
      - name: "spike s6: the committed relink report reproduces"
        if: matrix.channel == 'stable'
        run: cargo run -q -p fathom-analyze --features sqlite-bundled --example s6_spike -- --check

      # The headless CI-gate binary `e6.6` puts inside pipelines (§6.1), built on both channels: a
      # TUI-only test suite would never notice that `fathom check` had grown a dependency on a terminal.
      - name: build the headless `minimal` binary
        run: cargo build -p fathom-cli --no-default-features --features minimal

      - name: test the headless configuration
        # What this configuration may assert is stated test by test and file by file, not here: most of the
        # CLI suite indexes a fixture and drives a verb that reads that index back, and a binary with no
        # store, no shell and no watcher refuses every one of them with `FEATURE_ABSENT` (9) — so the suites
        # name the feature they need (`#![cfg(feature = "sqlite-bundled")]` on a whole store-backed file,
        # `#[cfg(feature = "tui")]` on a shell one, `#[cfg(...)]` per test where a file has both headless and
        # store-backed claims). `reco-37te` started that on `tests/check_verb.rs`; `reco-kltg` finished it on
        # the twenty files this leg was still red on. Run this command before adding a CLI test file: a new
        # store-backed suite with no gate goes red here, which is the whole point of the leg.
        run: cargo test -p fathom-cli --no-default-features --features minimal

      # The MSRV floor, on the floor (§2): "a dependency that needs newer Rust is discovered locally, not
      # by a user" — and locally means here, for the ones who do not read this file.
      - name: build on the declared MSRV
        if: matrix.channel == 'msrv'
        run: cargo +$MSRV build --workspace --no-default-features --features minimal

      # `e7.5` (reco-60m): the CLI reference page is generated from the binary's own `--help`, so CI is
      # what keeps it from lying about a flag. It runs here rather than in `contracts.yml` because its
      # source is a compiled program, and on the linux/stable leg because that is the leg whose build the
      # committed page was written from. clap's argument tree is feature-independent in this workspace — no
      # `#[arg]` in `verbs.rs` sits behind a `#[cfg(feature = …)]`, so the `--all-features` build this leg
      # already produced renders the same help as the default one. If a feature-gated flag is ever added,
      # this step changes to `cargo build -p fathom-cli` and the comment says why.
      - name: "e7.5 docs: the CLI reference is the binary's own --help, and every documented command types"
        if: matrix.channel == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          python3 tools/gen_docs.py check --page cli
          python3 tools/check_docs_site.py

      # `m2` (`reco-by2`): the gate as a thing outsiders install, as one object with one set of promises.
      # `docs/recipes/gate-a-pipeline.md` told readers to run `./ci/install-fathom.sh` for two milestones
      # before the file existed, which is the exact failure this step is: a promise in a document and no
      # program behind it. It checks the installer (including that the installer *refuses* a store-less
      # binary, verified against a fabricated one), that the reusable workflow's inputs and verbs all
      # exist, that the dogfood job runs the gate over the corpus, and that every `ci/…sh` a page names is
      # a file.
      - name: "m2 CI gate: the installer, the reusable workflow and the documented paths are one story"
        if: matrix.channel == 'stable' && matrix.os == 'ubuntu-latest'
        run: python3 tools/check_ci_gate.py

      # `e7.7` (`reco-rny`): the beta loop, as a build. The channel, the forms, the weekly register, the
      # dispositions and the changelog all exist to be drifted, and a drift here is a beta report that lands
      # somewhere nobody reads or a release whose notes dropped a ticket. Nothing in this step needs the
      # binary; `lint` is advisory on purpose — this repository's commit style is a sentence, and a tool that
      # demanded `fix(area):` before it could describe one would be a tool that gets bypassed.
      - name: "e7.7 beta loop: one channel, one vocabulary, a register, and a changelog that covers its commits"
        if: matrix.channel == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          python3 tools/check_beta_loop.py
          python3 tools/beta_intake.py ledger
          python3 tools/gen_changelog.py audit
          python3 tools/gen_changelog.py lint
          python3 tools/gen_changelog.py draft --version Unreleased | head -3

      # The five-minute criterion, as a run rather than as an adjective: eight steps over the miniature,
      # each asserting its own exit code (two of them 7, on purpose), the whole thing inside 300 s, and
      # the docs page carrying the numbers this run measured.
      - name: "m2 the five-minute demo runs, is inside its budget, and the page says so"
        if: matrix.channel == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          python3 tools/five_minute_demo.py self-test
          python3 tools/five_minute_demo.py check
      - name: "m2 the demo repository assembles from the pack the binary ships"
        if: matrix.channel == 'stable' && matrix.os == 'ubuntu-latest'
        run: python3 tools/publish_demo_repo.py check

      # `e7.6` (reco-3qr): the clone half of the five-minute criterion. The tour above runs on the miniature
      # the binary unpacks; this runs on a `git clone` of the repository that gets published, indexes it,
      # and holds the output of ONE command against the catalogue the tour and the answer key are generated
      # from — asserting the seeded findings arrive *and* that the documented gaps are still gaps, so a
      # page that is stale in either direction fails here rather than in a stranger's first five minutes.
      - name: "e7.6 the demo clone: one command reproduces every documented finding"
        if: matrix.channel == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          python3 tools/demo_acceptance.py self-test
          python3 tools/demo_acceptance.py check --json /tmp/fathom-demo-exhibits.json

      # `e7.4` (reco-3q4): the same argument one directory over. `packaging/completions` and
      # `packaging/man` are committed so `dist` can put them in an archive without running a binary in the
      # release job — which means they can go stale, and a stale completion is a flag that exists in
      # `--help` and not in your shell. They are generated from the same `clap::Command` the binary parses
      # with, so the only honest check is "regenerate and diff", and it runs on the leg that just built the
      # binary for the same reason (§8.4: a generated file is checked by regenerating it).
      #
      # The build is explicit, and named, for one line: a man page's VERSION section prints
      # `fathom --version`, which carries the feature list the binary was compiled with, so the file is
      # only "the binary's own grammar" for the one binary it was blessed from — the default, shipped
      # build (ADR-002 §6.1, and `gen_shell_artifacts.py`'s own docstring). Without this line the binary
      # on disk is the headless `minimal` one built above, and this step is red for a reason that has
      # nothing to do with the diff under review.
      - name: "e7.4 packaging: the completions and man pages are the binary's own grammar"
        if: matrix.channel == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          cargo build --locked -p fathom-cli
          python3 tools/gen_shell_artifacts.py check
          python3 tools/gen_shell_artifacts.py self-test

      - name: the binary answers, on every platform
        run: |
          cargo build -p fathom-cli --no-default-features --features minimal
          ./target/debug/fathom --version
          ./target/debug/fathom --help
          ./target/debug/fathom doctor --privacy

      # §6: the default build links no network-capable crate. A list, not a shrug — if one appears the job
      # says which, and `tools/check_workspace.py shipped` prints the same closure from the model.
      - name: default binary links zero network-capable crates
        if: matrix.channel == 'stable'
        run: |
          cargo tree -p fathom-cli --no-default-features --features minimal -e normal --prefix none \
            | awk '{print $1}' | sort -u > /tmp/deps.txt
          for banned in reqwest ureq hyper rustls native-tls openssl-sys git2 libgit2-sys axum; do
            if grep -qx "$banned" /tmp/deps.txt; then
              echo "::error::default build links $banned — ADR-002 R6"; exit 1
            fi
          done

  # §2's third channel: known before it ships, rather than in the week after.
  beta:
    name: beta (allowed to fail)
    needs: [fmt, clippy]
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: install beta
        run: rustup toolchain install beta --profile minimal
      - name: build (everything, on beta)
        run: cargo build --workspace --all-features
      - name: test (everything, on beta)
        run: cargo test --workspace --all-features
