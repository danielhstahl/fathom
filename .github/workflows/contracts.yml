# Contract gates: the documents and the architecture decisions, as executable checks.
#
# ADR-002 §8 says the boundary lint must be *in CI*, and `tools/check_workspace.py check` fails (rule
# C01) if the required invocations disappear from `.github/workflows/*.yml` — that is what makes "the
# lint is wired up" a checked fact. `e0.7` (reco-e77) took the option this file offered: the placeholder
# `rust` job that used to live here is now `ci.yml`'s three-OS matrix, and no step was dropped — the
# remaining half of §8.1's list (`cargo fmt`, the two `clippy` invocations, `cargo deny check`,
# `cargo +$MSRV`) is in `ci.yml`, this half is here.
#
# The `contracts` job deliberately needs no Rust toolchain: a gate that only runs after a 4-minute
# dependency build is a gate that people skip.

name: contracts

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  contracts:
    name: docs + workspace contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: glossary, plan references and link consistency
        run: python3 tools/check_docs.py
      - name: "e7.5 docs site: no orphan page, no dangling anchor, no undocumented shipped feature"
        # `docs/index.md` is the front door of the docs site, and this is the gate that keeps it a door:
        # every page under `docs/` is reachable from it, every fragment link lands on a heading, and the
        # four generated pages are the generators' own output. The coverage half is the acceptance
        # criterion made mechanical — a verb, a TUI view, a build feature or a detector that ships without
        # a documentation entry fails the build, because the enumerations come out of `enum Verb`,
        # `features.rs`, `recommender.tui.views` and the blessed detector catalogue rather than out of a
        # list somebody maintains. The `cli` page is not checked here: its source is a built binary, and
        # `ci.yml` runs both halves again in the leg that has a compiled binary, because two of the checks
        # have a program as their source: the `cli` page is clap's `--help`, and every command a page tells
        # the reader to type is parsed by clap itself (`tools/check_docs_commands.py`, reached through
        # `check_docs_site.py`). Here they skip themselves with a printed note rather than passing silently.
        run: |
          python3 tools/gen_docs.py check --page cheatsheet --page detectors --page features
          python3 tools/check_docs_site.py
      - name: "reco-j1o no shipped sentence claims a closed ticket is unbuilt"
        # `fathom why` used to print, as its own scope statement, that the module graph was `e3.1`'s and
        # the graph delta was `e3.2`'s — both beads closed, both features in the index the reader was
        # standing in. A command a document tells you to type is checked against clap by
        # `tools/check_docs_commands.py`; this is the same argument applied to a documented *cause*: a
        # sentence that promises a ticket is resolved through `.plan/keymap.json`, looked up on the board
        # with `bd list --all --json`, and failed when the bead is closed. Without `bd` on the runner the
        # check prints that it cannot see the board instead of passing silently.
        run: python3 tools/check_ticket_claims.py
      - name: "e5.9 demo miniature: the shipped pack is the one the generator writes"
        # `fathom --demo` is the first thing a stranger runs, and its repository is a checked-in asset —
        # which means it can drift from the thing that generated it, from its own manifest, or from the
        # counts the guide prints, silently and in a way nobody notices until the demo looks thin. The
        # generator is deterministic (pinned dates, pinned identities), so a diff here is a real change to
        # the miniature and not noise from a different machine.
        run: python3 tools/gen_demo_repo.py check
      - name: "m2 CI gate: the installer, the workflows and the documented paths are one story"
        # The same step `ci.yml` runs, run here too on purpose: the half of it that reads documents needs
        # no binary, and a documentation change that deletes a script it names should be caught by the
        # job that is already running on documentation alone.
        run: |
          python3 tools/check_ci_gate.py
          python3 tools/publish_demo_repo.py check
      - name: "e7.6 demo: the answer key matches the catalogue, and the film is still honest"
        # Neither half needs a binary: one regenerates the published answer key from the catalogue and
        # diffs it, the other re-reads the committed asciicast and refuses it if it runs over five minutes,
        # carries a sound track, predates the demo's current `demo-v*` tag, or has lost one of the seeded
        # pathologies from the frame. A documentation change that quietly invalidates the demo is caught on
        # the job that only reads files.
        run: |
          python3 tools/demo_exhibits.py check
          python3 tools/record_demo.py check
      - name: ADR-002 model, generated tables, ticket->crate map, this file's wiring
        run: python3 tools/check_workspace.py check
      - name: module-boundary lint (fails a crate importing uphill)
        run: python3 tools/check_workspace.py lint
      - name: "e2.11 delta model: the version policy refuses a breaking change with no version bump"
        # `reco-tt4`'s acceptance criterion 4, as a step. `schemas/episode-delta.schema.json` is the one
        # document the TUI, the CLI, the export and an MCP tool result all read, so "additive keeps the
        # version, breaking bumps it" has to be a machine decision. The baseline it compares against is
        # checked in, so the diff that blesses a breaking change is a reviewed diff.
        run: python3 tools/check_delta_compat.py check
      - name: "e2.11 delta model: that gate is awake (breaking edits refused on a temp copy)"
        # A gate nobody has watched fail is decoration. This mutates a copy of the schema in a temporary
        # tree — required key added, property renamed, type narrowed, enum shrunk — and fails if any of
        # those passes at the same version, or if a genuinely additive edit is refused.
        run: python3 tools/check_delta_compat.py self-test
      - name: "e0.8 config: schemas/fathom.schema.json is what the key spec generates"
        # ADR-002 §6.1: "CI regenerates and diffs the checked-in file". A hand-edited schema is
        # worse than none: the editor becomes the confident party and it is wrong.
        run: PYTHONPATH=src python3 -m recommender.config schema --check
      - name: "e0.8 config: the config reference tables match the key spec"
        run: PYTHONPATH=src python3 -m recommender.config doc --check
      - name: "e0.8 config: a checked-in example repo config validates and explains"
        run: |
          PYTHONPATH=src python3 -m recommender.config schema --validate fathom.toml
          PYTHONPATH=src python3 -m recommender.config --repo . explain --path src/foo.rs >/dev/null
      - name: "e0.9 taxonomy: the table answers for this repo, and explain names its rule"
        # The pytest suite is where the decision table and the cost bounds are asserted; this step
        # is the cheaper claim that the *verb surface* is wired to the same engine the tests use,
        # on this repository's own config, with the paths a reviewer would actually ask about.
        run: |
          PYTHONPATH=src python3 -m recommender.taxonomy --repo . explain -q \
            dist/app.min.js vendor/x/y.go Cargo.lock tests/test_taxonomy_contract.py src/foo.rs
          PYTHONPATH=src python3 -m recommender.taxonomy --repo . explain --json src/foo.rs | head -1
          PYTHONPATH=src python3 -m recommender.taxonomy classes >/dev/null
          PYTHONPATH=src python3 -m recommender.taxonomy rules --class generated >/dev/null
          PYTHONPATH=src python3 -m recommender.taxonomy bench --repeat 2 | tail -1
      - name: "e2.1 change classifier: accuracy on the labelled fixture set, reported (AC 1)"
        # The gate is the number, printed. `score` exits non-zero under the bar and prints the
        # per-class and per-shape tables plus every misclassification with the reason it got, so
        # a red run is diagnosable from the log without reproducing it. The labels are written
        # against the built-in table, so this step does not depend on this repo's fathom.toml.
        run: PYTHONPATH=src python3 -m recommender.change score --min 0.95
      - name: "e2.1 change classifier: the verb surface reads this repository's own bytes"
        # The pytest suite asserts the ladder and the cache; this is the cheaper claim that the
        # CLI is wired to the same engine, that it reads real blobs, and that the episode view
        # aggregates. `--json` is what a pane would read, not prose for a human.
        run: |
          PYTHONPATH=src python3 -m recommender.change explain --repo . -q \
            Cargo.lock README.md src/recommender/change/policy.py output/mozreco/ingest/timeline.py
          PYTHONPATH=src python3 -m recommender.change explain --repo . --json Cargo.lock | head -1
          cat > /tmp/self.json <<'JSON'
          {"id": "self", "changes": [
            {"path": "Cargo.lock"},
            {"path": "src/recommender/change/markers.py", "content": "class Marker: pass\n"}
          ]}
          JSON
          PYTHONPATH=src python3 -m recommender.change episode --repo . --manifest /tmp/self.json --show 2
          PYTHONPATH=src python3 -m recommender.change classes >/dev/null
          PYTHONPATH=src python3 -m recommender.change markers | head -3
          PYTHONPATH=src python3 -m recommender.change bench --repeat 2 | tail -1
      - name: "e2.2 noise suppression: fold precision, reported (AC 1, AC 2)"
        # The bar that matters is precision and it is absolute: every false fold is one real
        # change the tool hid. `score` prints the four tables and names each false fold, so a
        # red run says which change was hidden rather than only that an average slipped. The
        # labels are written against the built-in tables, so this does not read this repo's
        # fathom.toml.
        run: PYTHONPATH=src python3 -m recommender.noise score --min-accuracy 0.95 --min-precision 1.0 --min-recall 0.90 --min-episodes 1.0
      - name: "e2.2 noise suppression: the verb surface reads real pairs and prints its receipts"
        # Same engine as the renderer: the CLI's fold line is `Suppression.render()`, and the
        # audit the CLI runs on its own output is the one the contract test blesses.
        run: |
          PYTHONPATH=src python3 -m recommender.noise languages | head -3
          PYTHONPATH=src python3 -m recommender.noise policy | tail -3
          mkdir -p /tmp/noise/before/src /tmp/noise/after/src
          printf 'use std::collections::HashMap;\n\npub fn thing(a: i32, b: i32) -> i32 {\n    let total = a + b;\n    total\n}\n' > /tmp/noise/before/src/a.rs
          printf 'use std::collections::HashMap;\n\npub fn thing(\n    a: i32,\n    b: i32,\n) -> i32 {\n\tlet total = a + b;\n\ttotal\n}\n' > /tmp/noise/after/src/a.rs
          PYTHONPATH=src python3 -m recommender.noise explain src/a.rs --old-repo /tmp/noise/before --repo /tmp/noise/after | head -4
          PYTHONPATH=src python3 -m recommender.noise episode --old-repo /tmp/noise/before --repo /tmp/noise/after --path src/a.rs | head -3
          PYTHONPATH=src python3 -m recommender.noise episode --old-repo /tmp/noise/before --repo /tmp/noise/after --path src/a.rs --json | head -1
          PYTHONPATH=src python3 -m recommender.noise episode --old-repo /tmp/noise/before --repo /tmp/noise/after --path src/a.rs --no-suppress | head -2
          PYTHONPATH=src python3 -m recommender.noise bench --repeat 2 | tail -1
      - name: "e2.9 test surface: the labelled corpus clears its bars, printed (AC 1-5)"
        # Two of the five bars are absolute and for different reasons: a missed test deletion
        # and a false one are both a card that lies about a test, so recall and precision are
        # both 1.0 and every miss is named. Episode accuracy is arithmetic, not judgement, so
        # there is no slack in it either; only parse accuracy has any, for the one genuinely
        # ambiguous construct (`describe` with no `it`). Labels are hand-written in
        # `corpus.py` against the built-in policy, so this does not read this repo's fathom.toml.
        run: |
          PYTHONPATH=src python3 -m recommender.testsurface score --min-parse 0.95 \
            --min-pairs 1.0 --min-precision 1.0 --min-recall 1.0 --min-episodes 1.0
      - name: "e2.9 test surface: the verb surface is the same engine, and the demo audits clean"
        # The card's invariants (ratio with its absolutes, a location on every finding row, a
        # stated confidence) are checked by `render.audit`, which the CLI runs on its own
        # output and exits non-zero when it fails — so a step that runs a verb is also a step
        # that audits it. `demo` is the card the concept document prints, and `--capped` is the
        # row-cap path a real episode takes.
        run: |
          mkdir -p /tmp/ts/before/src /tmp/ts/before/tests /tmp/ts/after/src /tmp/ts/after/tests
          printf 'def test_a():\n    assert f() == 1\n\n\ndef test_b():\n    assert g() == 2\n' > /tmp/ts/before/tests/test_x.py
          printf 'def test_a():\n    assert f()\n' > /tmp/ts/after/tests/test_x.py
          printf 'def g():\n    return 1\n' > /tmp/ts/before/src/x.py
          printf 'def g():\n    return 1\n\n\ndef scale_and_shift(x):\n    y = x + 1\n    z = y * 2\n    w = z + x\n    return w\n' > /tmp/ts/after/src/x.py
          PYTHONPATH=src python3 -m recommender.testsurface card --old-repo /tmp/ts/before --repo /tmp/ts/after --path tests/test_x.py src/x.py | grep -q "New public logic, no new test"
          PYTHONPATH=src python3 -m recommender.testsurface card --old-repo /tmp/ts/before --repo /tmp/ts/after --path tests/test_x.py src/x.py --json | head -1
          PYTHONPATH=src python3 -m recommender.testsurface findings --old-repo /tmp/ts/before --repo /tmp/ts/after --path tests/test_x.py src/x.py | head -3
          PYTHONPATH=src python3 -m recommender.testsurface explain tests/test_x.py --old-repo /tmp/ts/before --repo /tmp/ts/after | grep -q "delta:"
          PYTHONPATH=src python3 -m recommender.testsurface languages | head -3
          PYTHONPATH=src python3 -m recommender.testsurface policy | tail -3
          PYTHONPATH=src python3 -m recommender.testsurface definition | head -3
          PYTHONPATH=src python3 -m recommender.testsurface demo | tail -2
          PYTHONPATH=src python3 -m recommender.testsurface demo --capped | grep -q "more: fathom testsurface card --all"
          PYTHONPATH=src python3 -m recommender.testsurface bench --repeat 2 | tail -1
      - name: "e2.8 non-code surfaces: the labelled corpus clears its bars, printed (AC 1-4)"
        # Three absolute bars, each because a softer one would hide a specific lie: rule
        # accuracy 1.0 over 37 fixtures (one per finding kind — the test derives that
        # requirement from the rule table, so a kind without a fixture fails here), precision
        # 1.0 over 12 traps (a false "this migration is irreversible" costs as much reviewer
        # trust as a missed one), episode accuracy 1.0 (counts and coordination are
        # arithmetic), and 6 of 6 surfaces covered — "the CI surface has a fixture" is
        # satisfiable by one fixture out of five findings, so the gate is per surface. Labels
        # are hand-written in `corpus.py` against the built-in policy, so this never reads
        # this repo's fathom.toml.
        run: |
          PYTHONPATH=src python3 -m recommender.noncode score --min-rules 1.0 \
            --min-precision 1.0 --min-episodes 1.0 --min-surfaces 6
      - name: "e2.8 non-code surfaces: the verb surface is the same engine, and the card audits clean"
        # The ticket's two headline criteria are grepped out of real output here: the env
        # cross-check in both directions (added-and-never-read, and removed-while-still-read),
        # and the explicit `needs deploy coordination` line for a migration-only episode.
        # `render.audit` / `checklist.audit` run on the CLI's own output and exit non-zero, so
        # every one of these steps is also an audit step; `demo --capped` is the row-cap path
        # a real episode takes, and its remainder line must name the verb that lists the rest.
        run: |
          mkdir -p /tmp/nc/before/src /tmp/nc/before/db/migrate /tmp/nc/before/.github/workflows
          mkdir -p /tmp/nc/after/src /tmp/nc/after/db/migrate /tmp/nc/after/.github/workflows
          printf '# Service configuration\nDATABASE_URL=postgres://localhost/app\nSEARCH_INDEX_HOST=search:9200\n' > /tmp/nc/before/.env.example
          printf '# Service configuration\nPG_DATABASE_URL=postgres://localhost/app\nPAYMENT_WEBHOOK_SECRET=\n' > /tmp/nc/after/.env.example
          printf 'DATABASE_URL = os.environ["DATABASE_URL"]\nSEARCH_INDEX_HOST = os.environ["SEARCH_INDEX_HOST"]\n' > /tmp/nc/before/src/settings.py
          printf 'PG_DATABASE_URL = os.environ["PG_DATABASE_URL"]\nSEARCH_INDEX_HOST = os.environ["SEARCH_INDEX_HOST"]\n' > /tmp/nc/after/src/settings.py
          printf 'name: release\non:\n  release:\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo hi\n' > /tmp/nc/before/.github/workflows/release.yml
          # `$` is split out so GitHub's expression parser never sees `${{ … }}` in *this*
          # workflow and tries to resolve a secret of ours; the fixture file gets the literal.
          DOLLAR='$'
          printf "name: release\non:\n  release:\njobs:\n  build:\n    runs-on: ubuntu-latest\n    environment: production\n    steps:\n      - run: sign ${DOLLAR}{{ secrets.SIGNING_KEY }}\n" > /tmp/nc/after/.github/workflows/release.yml
          printf 'class AddOrdersToInvoices < ActiveRecord::Migration[7.1]\n  def up\n    add_column :invoices, :order_id, :integer\n    execute "UPDATE invoices SET order_id = 0 WHERE order_id IS NULL"\n  end\nend\n' > /tmp/nc/after/db/migrate/20261017120000_add_orders_to_invoices.rb
          PYTHONPATH=src python3 -m recommender.noncode card --old-repo /tmp/nc/before --repo /tmp/nc/after --path .env.example src/settings.py .github/workflows/release.yml | grep -q "Code still reads a removed environment variable: SEARCH_INDEX_HOST"
          PYTHONPATH=src python3 -m recommender.noncode card --old-repo /tmp/nc/before --repo /tmp/nc/after --path .env.example src/settings.py .github/workflows/release.yml | grep -q "Environment variable added: PAYMENT_WEBHOOK_SECRET"
          PYTHONPATH=src python3 -m recommender.noncode card --old-repo /tmp/nc/before --repo /tmp/nc/after --path .env.example src/settings.py .github/workflows/release.yml --json | head -1
          PYTHONPATH=src python3 -m recommender.noncode checklist --repo /tmp/nc/after --path db/migrate/20261017120000_add_orders_to_invoices.rb | grep -q "needs deploy coordination: yes"
          PYTHONPATH=src python3 -m recommender.noncode findings --old-repo /tmp/nc/before --repo /tmp/nc/after --path .env.example src/settings.py | grep -q env-renamed
          PYTHONPATH=src python3 -m recommender.noncode explain .env.example --old-repo /tmp/nc/before --repo /tmp/nc/after | grep -q "env reader:"
          PYTHONPATH=src python3 -m recommender.noncode surfaces | head -3
          PYTHONPATH=src python3 -m recommender.noncode policy | tail -3
          PYTHONPATH=src python3 -m recommender.noncode definition | head -3
          PYTHONPATH=src python3 -m recommender.noncode demo | tail -2
          PYTHONPATH=src python3 -m recommender.noncode demo --capped | grep -q "more: fathom noncode checklist"
          PYTHONPATH=src python3 -m recommender.noncode bench --repeat 2 | tail -1
      - name: "e2.7 dependency risk: the corpus clears its bars, printed (AC 1-4)"
        # Four absolute bars, each because a softer one would hide a specific lie: provenance
        # and intent accuracy 1.0 (the ticket's criterion is the *difference* between
        # `intent: "…"` and `intent: not recorded`, so half-right is wrong), licence precision
        # *and* recall 1.0 (precision is the trap half — a checker that fires on every copyleft
        # row, including the dual-licensed and the development-only ones, would pass a
        # recall-only gate), advisory recall 1.0 including the unseverity advisory, freshness
        # accuracy 1.0 across five cache states, and reconciliation 1.0 on 28 authored cases and
        # 72 generated episodes. Expectations are hand-authored in `corpus.py` against the
        # built-in policy, so this never reads this repo's fathom.toml.
        run: |
          PYTHONPATH=src python3 -m recommender.deprisk score --min-cases 28
      - name: "e2.7 dependency risk: zero network calls, provenance printed, freshness stated (AC 1-4)"
        # The ticket's four criteria grepped out of real output. AC 1 is the loud one: `consent`
        # prints the three gates and states "0 network call(s)", `advisories --refresh` exits 8
        # at the gate (not at the socket) without user-scoped `privacy.advisories`, and `--plan`
        # shows every request a refresh would make without making one. AC 2 is checked in both
        # directions — the answer when the intent exists and `not recorded` plus its remedy when
        # it does not, including the prompt-digest case hooks v1 actually leaves behind. AC 3 is
        # the tense change: an expired cache must say `not checked recently` and never
        # `no advisories`. AC 4 is the edge path on the licence finding. `demo` and `card --check`
        # run `render.audit` on the CLI's own output and exit non-zero if a fact went missing.
        run: |
          PYTHONPATH=src python3 -c "import pathlib; p=pathlib.Path('/tmp/deprisk'); p.mkdir(exist_ok=True); import sys; sys.path.insert(0, 'src'); from recommender.deprisk import corpus as C, osv as O; (p/'fresh.json').write_text(O.serialize(C.cache_for('fresh', now=C.NOW), now=C.NOW)); (p/'old.json').write_text(O.serialize(C.cache_for('stale', now=C.NOW), now=C.NOW))"
          PYTHONPATH=src python3 -m recommender.deprisk consent | grep -q "default config makes 0 network call(s)"
          PYTHONPATH=src python3 -m recommender.deprisk consent --json | head -1
          PYTHONPATH=src python3 -m recommender.deprisk advisories --fixture advisory_hot --plan | grep -q "fetch allowed: no"
          # The refusal is an exit code, not a traceback: `set +e` around it so the step checks
          # the number rather than the shell deciding the step failed early.
          set +e
          PYTHONPATH=src python3 -m recommender.deprisk advisories --fixture advisory_hot --refresh
          REFRESH_STATUS=$?
          set -e
          if [ "$REFRESH_STATUS" -ne 8 ]; then
            echo "expected exit 8 (NETWORK_CONSENT_REQUIRED) without consent, got $REFRESH_STATUS" >&2
            exit 1
          fi
          PYTHONPATH=src python3 -m recommender.deprisk card --fixture intent_recorded | grep -q 'introduced by: episode ep-41'
          PYTHONPATH=src python3 -m recommender.deprisk card --fixture intent_missing | grep -q 'intent: not recorded'
          PYTHONPATH=src python3 -m recommender.deprisk card --fixture prompt_digest_only | grep -q 'prompt digest only'
          PYTHONPATH=src python3 -m recommender.deprisk card --fixture introduced_earlier | grep -q 'introduced by: episode ep-11'
          PYTHONPATH=src python3 -m recommender.deprisk card --fixture advisory_hot --cache /tmp/deprisk/fresh.json --now 1760000000 | grep -q 'GHSA-7jvh-c3cj-qqh6'
          PYTHONPATH=src python3 -m recommender.deprisk card --fixture advisory_hot --cache /tmp/deprisk/old.json --now 1760000000 | grep -q 'not checked recently'
          PYTHONPATH=src python3 -m recommender.deprisk card --fixture advisory_no_cache --cache /tmp/deprisk/absent.json | grep -q 'no advisory cache to read'
          PYTHONPATH=src python3 -m recommender.deprisk card --fixture copyleft_in_library | grep -q 'offending edge path'
          PYTHONPATH=src python3 -m recommender.deprisk card --fixture licence_drift | grep -q 'was MIT before'
          PYTHONPATH=src python3 -m recommender.deprisk card --fixture advisory_hot --check | tail -2
          PYTHONPATH=src python3 -m recommender.deprisk license --fixture copyleft_in_library --violations | grep -q 'strong-copyleft'
          PYTHONPATH=src python3 -m recommender.deprisk findings --fixture advisory_hot --severity critical --cache /tmp/deprisk/fresh.json --now 1760000000 | grep -q 'GHSA-7jvh-c3cj-qqh6'
          PYTHONPATH=src python3 -m recommender.deprisk provenance --fixture intent_recorded | tail -3
          PYTHONPATH=src python3 -m recommender.deprisk advisories --fixture advisory_hot --cache /tmp/deprisk/fresh.json --now 1760000000 | grep -q 'freshness:'
          PYTHONPATH=src python3 -m recommender.deprisk cache --cache /tmp/deprisk/fresh.json | head -2
          PYTHONPATH=src python3 -m recommender.deprisk summary --fixture bump_storm
          PYTHONPATH=src python3 -m recommender.deprisk policy | tail -3
          PYTHONPATH=src python3 -m recommender.deprisk matrix | head -3
          PYTHONPATH=src python3 -m recommender.deprisk rules | head -3
          PYTHONPATH=src python3 -m recommender.deprisk definition | head -3
          PYTHONPATH=src python3 -m recommender.deprisk explain consent | tail -2
          PYTHONPATH=src python3 -m recommender.deprisk demo --now 1760000000 | grep -q 'who asked for this'
          PYTHONPATH=src python3 -m recommender.deprisk property --seeds 3 | tail -1
      - name: "e2.3 folder structure: the labelled corpus clears its bars, printed (AC 1-4)"
        # Five absolute bars and one floor. Shape accuracy and summary accuracy are both 1.0
        # because the one-sentence answer is the deliverable: a fixture whose sentence changed is
        # an answer that changed, and the diff names the clause. Precision is 1.0 over eight traps,
        # because a false "the agent reorganised the tree" costs the same reviewer trust as a
        # missed one. Reconciliation is 1.0 over every fixture *plus* 400 generated episodes, which
        # is AC 2 as a property rather than as a spot check. The one floor, `--min-separation`, is
        # AC 3: the same twenty files, changed in place (0.000) versus reshuffled across the tree
        # (0.900), required to stay in different bands. Labels are hand-written in `corpus.py`
        # against the built-in policy, so this never reads this repo's fathom.toml.
        run: |
          PYTHONPATH=src python3 -m recommender.structure score --min-shapes 1.0 \
            --min-summaries 1.0 --min-precision 1.0 --min-episodes 1.0 --min-reconcile 1.0 \
            --min-separation 0.3 --min-shapes-covered 4
      - name: "e2.3 folder structure: the verb surface is the same engine, and the card audits clean"
        # The ticket's four criteria are grepped out of real output here: the four shape sentences,
        # the reconciliation line, the two churn bands for the same twenty files, and a card that
        # `render.audit` has checked (the CLI runs the audit on its own output and exits non-zero).
        # `property` is AC 2 on generated episodes; a row that fails to sum exits non-zero.
        run: |
          mkdir -p /tmp/st/before/pkg/util /tmp/st/before/pkg/other /tmp/st/after/internal/pkg/util
          printf 'a()\nb()\nc()\nd()\n' > /tmp/st/before/pkg/util/a.py
          printf 'e()\nf()\ng()\n' > /tmp/st/before/pkg/util/b.py
          printf 'h()\ni()\n' > /tmp/st/before/pkg/util/c.py
          printf 'x()\n' > /tmp/st/before/pkg/other/x.py
          mkdir -p /tmp/st/after/pkg/other
          printf 'a()\nb()\nc()\nd()\n' > /tmp/st/after/internal/pkg/util/a.py
          printf 'e()\nf()\ng()\n' > /tmp/st/after/internal/pkg/util/b.py
          printf 'h()\ni()\n' > /tmp/st/after/internal/pkg/util/c.py
          printf 'x()\n' > /tmp/st/after/pkg/other/x.py
          PYTHONPATH=src python3 -m recommender.structure card --old-repo /tmp/st/before --repo /tmp/st/after | grep -q "moved to \`internal/pkg/util\`"
          PYTHONPATH=src python3 -m recommender.structure summary --old-repo /tmp/st/before --repo /tmp/st/after
          PYTHONPATH=src python3 -m recommender.structure card --fixture module_split | grep -q "was split into"
          PYTHONPATH=src python3 -m recommender.structure summary --fixture directory_flatten | grep -q "was flattened into"
          PYTHONPATH=src python3 -m recommender.structure summary --fixture package_rename | grep -q "was renamed to"
          PYTHONPATH=src python3 -m recommender.structure summary --fixture subtree_move | grep -q "directory shape preserved"
          PYTHONPATH=src python3 -m recommender.structure card --fixture cross_tree_reshuffle | grep -q "table reconciles to the episode totals"
          PYTHONPATH=src python3 -m recommender.structure separation | grep -q "gap 0.900"
          PYTHONPATH=src python3 -m recommender.structure dirs --fixture subtree_move --json | head -1
          PYTHONPATH=src python3 -m recommender.structure stories --fixture package_rename | head -2
          PYTHONPATH=src python3 -m recommender.structure findings --fixture cross_tree_reshuffle | head -3
          PYTHONPATH=src python3 -m recommender.structure explain --fixture module_split | head -3
          PYTHONPATH=src python3 -m recommender.structure shapes | head -3
          PYTHONPATH=src python3 -m recommender.structure policy | tail -3
          PYTHONPATH=src python3 -m recommender.structure definition | head -3
          PYTHONPATH=src python3 -m recommender.structure property --seeds 20 | tail -1
          PYTHONPATH=src python3 -m recommender.structure demo | tail -2
      - name: "e0.6 ADR-006: the keymap, layouts and ladder in the document are the shipped ones"
        # ADR-006 §0: the table in the document is the source of the help overlay (e1.5), the
        # palette labels (e5.4) and the cheatsheet (e7.5). Three hand-copied copies of a keymap
        # is three chances for the help overlay to lie, so CI diffs the document against the
        # tables it is generated from — the same contract as e0.8's config reference above.
        run: PYTHONPATH=src python3 -m recommender.tui doc --check
      - name: "spike s1: the tree-sitter accuracy tables are the report's, generated"
        # `docs/concepts/structure-extraction.md` carries the verdict that decides which grammars
        # `e3.1` ships (ADR-002 §6.5), and every number in it is generated from
        # `benchmarks/reports/s1-tree-sitter-accuracy.json`. The pytest suite asserts the same thing
        # plus the corpus/threshold invariants; this step is here so the failure says what it is.
        run: python3 tools/gen_structure_tables.py check
      - name: "spike s2: the turn corpus is coherent on its own terms"
        # `crates/fathom-fixtures/corpus/turns/` is hand-authored truth over mechanically extracted commit
        # facts, and the coherence rules (every commit in exactly one turn, turns contiguous, pathologies
        # pointing at real commits, every judgement call carrying a note) are the only thing standing between
        # a precision number and a typo. Cheap, no build: the pytest suite asserts the same thing plus the
        # report/gate invariants.
        run: python3 tools/author_turn_corpus.py --validate-only
      - name: "spike s2: the segmentation tables in ADR-003 §18 and the concept document are generated"
        # Every number in `docs/concepts/episode-segmentation.md` and ADR-003 §18 comes out of
        # `benchmarks/reports/s2-segmentation-accuracy.json`, which is what closed ADR-003 §4.4 and §13.7.
        # A hand-copied table there is a table that keeps its old numbers the day the corpus changes.
        run: python3 tools/gen_segment_tables.py check
      - name: "spike s4: rename and copy detection re-measures to the committed report"
        # `benchmarks/reports/s4-rename-detection.json` is what replaces the guessed 90 % bar in `e2.4`
        # (`reco-a0v`), and its 51 gates are claims about hand-authored git histories. The fixture
        # repositories are built by real `git` on the runner, from scripts that fix every date, identity
        # and config input, so this re-runs the whole measurement (~40 s) and fails if any count, gate,
        # threshold or chosen fact bar moved. A spike that cannot be re-measured is an anecdote.
        run: PYTHONPATH=src python3 -m recommender.rename.spike --report benchmarks/reports/s4-rename-detection.json --check
      - name: "spike s4: the rename-detection document's numbers are the report's, generated"
        # Every number in `docs/concepts/rename-detection.md` — the fact/guess recommendation `e2.4` will
        # be written from — is rendered from the report by the same generator the doc cites.
        run: python3 tools/gen_rename_tables.py check
      - name: "e2.4 rename pairing: the shipped detector re-measures to the committed report"
        # `benchmarks/reports/e2-4-rename-pairing.json` is the acceptance criteria of `reco-a0v` turned
        # into numbers: the fact tier asserting nothing untrue, recall stated per representation class so a
        # split cannot hide inside a rename average, the accept/reject/re-open rules actually working, and
        # the cost curve flat against repository size while the refused O(repo) mode is not. Built from
        # real `git` histories on the runner (~10 min), and a gate that drifted is a claim that changed.
        run: PYTHONPATH=src python3 -m recommender.rename score --check
      - name: "e2.4 rename pairing: the concept document's numbers are the report's, generated"
        run: python3 tools/gen_rename_pairing_tables.py check
      - name: "e2.4 rename pairing: the card audits itself, and the verbs work on a real repository"
        # The auditor is only worth having if something runs it: this renders a real card from a real
        # repository and fails if the card stopped telling the truth about its own tiers.
        run: |
          PYTHONPATH=src python3 -m recommender.rename demo --audit | tail -1
          PYTHONPATH=src python3 -m recommender.rename policy | head -3
          PYTHONPATH=src python3 -m recommender.rename explain | head -3
          PYTHONPATH=src python3 -m recommender.rename score --json --only clean_moves | head -1
      - name: "e1.5 TUI: the Rust shell's parity tables are the Python ones, generated"
        # `crates/fathom-tui/tests/tables/mod.rs` is generated from `src/recommender/tui/`, because
        # a Rust copy of the keymap that was hand-copied is a second source of truth with a
        # different opinion. Same argument, same shape of step as the two above (ADR-006 §0).
        run: python3 tools/tui_tables.py check
      - name: "e0.6 ADR-006: measured key delivery on a real pty (the impossible-chord list)"
        # §8.1's table is measured, not remembered. This is the step that keeps it measured:
        # it prints the same KEYPROBE lines the ADR cites, on a real terminal, in CI.
        run: |
          PYTHONPATH=src python3 -m recommender.tui probe --machine | tee /tmp/keyprobe.txt
          grep -q "pty_available=true" /tmp/keyprobe.txt || { echo "::error::no pty in this runner"; exit 1; }
          # The two physical-ambiguity claims are machine keys of their own (keyprobe.MACHINE_KEYS);
          # the `delivers[...]` lines below them are the per-chord table, keyed by the chord spelling.
          grep -q "^ctrl_i_is_tab=true" /tmp/keyprobe.txt
          grep -q "^ctrl_c_is_a_signal_not_a_byte=true" /tmp/keyprobe.txt
      - name: "e0.6 ADR-006: overrides merge, palette has no holes, sequences resolve"
        run: |
          PYTHONPATH=src python3 -m recommender.tui conflicts --toml fathom.toml
          PYTHONPATH=src python3 -m recommender.tui conflicts --set "global.q=app.quit"
          PYTHONPATH=src python3 -m recommender.tui palette | tail -2
          PYTHONPATH=src python3 -m recommender.tui press "q j <Enter> d x"
          PYTHONPATH=src python3 -m recommender.tui keys --cheatsheet | head -3
      - name: ADR-002 / ADR-004 / ADR-005 / e0.6 / e0.8 / e0.9 / e2.1 contract suites
        run: |
          python -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q
