# Fathom's own `fathom.toml` — this repository, configured with the system `e0.8` ships.
#
# It is deliberately a real config, not an example: CI validates it against
# `schemas/fathom.schema.json` and `tests/test_config_contract.py` asserts it resolves with
# **zero warnings**, which is the cheapest way to keep the schema, the key spec and this file
# honest about each other. An example config that nothing checks rots in a week.
#
# Layered as flags > $FATHOM_* > this file > user config > built-in defaults; every effective
# value is explainable with `fathom config explain`.

meta.config_version = 1

[deps]
# The workspace is Rust plus the Python contract fixtures of ADR-002/004/005. Listing only what
# is here is not politeness: `deps.ecosystems` is an analyzer input (ADR-004 §5.1), so a
# stale entry is a cache key that moves for no reason.
ecosystems = ["python", "rust"]

[deps.advisories]
# Deliberately left at the built-in `mode = "cache"`: this file decides what Fathom may *read*,
# and it cannot decide that it may call out. Fetching needs `mode = "refresh"` here *and*
# `privacy.advisories = true` in the user's own config, because consent that a cloned repository
# can grant is not consent (ADR-001 §7.5). `fathom deprisk consent` prints all three gates.
# mode = "refresh"
max_age_hours = 24
stale_limit_hours = 168
cache = ".fathom/advisories.json"

[deps.license]
# The layer question this repository can answer and no scanner can: which of *our* folders are
# library code, meaning other people link them and inherit whatever we linked. Everything below
# the surfaces does — `l0_vocabulary` through `l3_analysis`, exactly as `[layers]` above names
# them. With that said, a GPL dependency arriving in `crates/fathom-analyze` is a refusal
# (`strong_copyleft_in_library = "deny"`, the built-in) rather than a note in a card nobody reads.
library_layers = ["l0_vocabulary", "l1_durable_state", "l2_outside_door", "l3_analysis"]

[deps.provenance]
# An `Agent-Intent:` trailer on the commit is the intent path that works today; hooks v1 stores a
# prompt *digest*, which is printed as a partial and never as the reason (ADR-005 §2.2).
require_intent = true
search_previous_episodes = true

[noise]
# Change that carries no reviewable information. `extend`, so these add to the built-ins
# instead of replacing them, and a `!` line re-promotes a path a broader glob swallowed.
globs = [
  "**/__pycache__/**",
  "**/.pytest_cache/**",
  ".plan/plan.json",          # generated by `.plan/gen.py`; the diff is the generator's
  "benchmarks/reports/**",    # measured output, not source
]
builtins_version = 1

[test]
globs = ["tests/**", "**/test_*.py"]
# `e2.9`'s findings and their thresholds are keys too (`test.findings.*`, `test.untested.*`,
# `test.proxy.confidence.*`, `test.card.max_findings`), but this repository runs every one of
# them at the built-in default: the built-ins are the thing `tests/test_test_surface_contract.py`
# scores, and a repo config that moved them would be tuning the tool to pass its own tests.
# `python3 -m recommender.testsurface definition` prints those numbers as sentences, and
# `... policy` prints which layer each one came from.

[api]
# `e3.12` (reco-u1i) decided that a test file is not a public API surface, and this repository is the
# case that made the argument: `fathom check` reported the rename of a Python test function in
# `tests/test_release_contract.py` as the breaking removal of a public item. The built-in table
# (`crates/fathom-analyze/src/api/testpath.rs`) declines those files now — all 211 of them at this commit — and
# says so in the report rather than dropping them silently. Nothing is set here on purpose:
# `track_tests = true` would put a test tree back on the surface of a package nobody imports, and
# moving them into `ignore` would hide an exclusion this language decides instead of naming it. The
# one line that *would* belong here is a repository's own unusual claim, and this is not that.

[rename]
# `e2.4` (reco-a0v) pairs paths across a review window and separates what git asserts from what the
# content matcher only guesses. The two bars below are the ones spike s4 and this ticket measured, so
# they are written down rather than left at a guessed default:
#   fact_bar 0.75   git's own similarity needed before a pairing is shown as a fact. At git's shipped
#                   0.50 it asserts a pairing the corpus names as not-a-move and still misses every
#                   rewrite below R050; at 0.75 it asserts nothing untrue (precision 1.00 on the
#                   corpus, 0 wrong) — see benchmarks/reports/s4-rename-detection.json.
#   guess_floor 0.15 the lowest-scoring guess the card prints. No threshold separates the corpus's
#                   decoy from its true rewrites, so this is a display budget, and 0.15 is where the
#                   measured trade stops buying true pairings per lie.
# The rest (`rename.candidates.*`, `rename.content.*`, `rename.card.rows`) stays at the built-in
# default for the same reason `[test]` leaves its knobs alone: the defaults are what
# `tests/test_rename_pairing_contract.py` scores, and moving them here would tune the tool to pass its
# own tests. `python3 -m recommender.rename policy` prints every one and the layer that won.
fact_bar = 0.75
guess_floor = 0.15

[taxonomy.classes]
# `e0.9`'s built-in table already knows this repository's shapes, so only what it *cannot* see
# from a path alone belongs here, and each line says why. A line that merely repeats a built-in
# is a line that goes stale the day the built-in is improved.
generated = [
  ".plan/plan.json",   # written by `.plan/gen.py`. The `noise.globs` line above says the same
                       # fact is not worth reviewing; that is the other axis — "may I fold it"
                       # and "is it hand-editable" are different questions, and `explain`
                       # prints both, each with the rule that answered it
]
schema = [
  "schemas/*.json",    # regenerated by `config schema --write`, but the class that matters
                       # downstream is `schema`: `e2.1` has to be able to say "the public
                       # contract moved" even when the bytes are derived. Asserting it here is
                       # also how this repo pins the answer against a future built-in table
                       # that decides to claim `schemas/**` as generated
]

[non_code]
# Surfaces `e2.8` reports separately from code: CI, budgets and the generated schema are all
# reviewed as contracts, not as lines of logic.
patterns = [".github/workflows/**", "benchmarks/budgets.json", "schemas/**", ".plan/**"]
# `e2.8`'s findings and thresholds are keys too (`non_code.findings.*`, `non_code.env.*`,
# `non_code.flags.*`, `non_code.migration.*`, `non_code.ci.*`, `non_code.iac.*`,
# `non_code.container.*`, `non_code.card.max_actions`), and this repository runs every one of
# them at the built-in default for the same reason `[test]` does: the built-ins are what
# `tests/test_noncode_contract.py` scores, and a repo config that moved them would be tuning
# the tool to pass its own tests. `python3 -m recommender.noncode definition` prints those
# numbers as sentences and `... policy` prints which layer each one came from — which is also
# how this file stays honest about running none of them: a key that is set here would show up
# in `policy` as `repo fathom.toml` rather than `built-in default`.

# `e2.3`'s structure keys (`structure.move.*`, `structure.split.*`, `structure.churn.*`,
# `structure.findings.*`, `structure.metrics.top_dirs`, `structure.code_classes`) are keys too,
# and this repository runs all 37 at the built-in default for the same reason `[test]` and
# `[non_code]` do: the built-ins are what `tests/test_structure_delta_contract.py` scores, and a
# repo config that moved `structure.move.min_files` or a churn band would be tuning the tool to
# pass its own corpus. `python3 -m recommender.structure definition` prints those numbers as
# sentences and `... policy` prints which layer each came from — which is also how this file
# stays honest about running none of them: a key set here would show up in `policy` as
# `repo fathom.toml` rather than `built-in default`.

[graph]
# Directories that are not this repository's architecture. `node_modules` and `__pycache__` are other
# people's build output. `corpus` is this repository's own: every fixture corpus in the tree is a
# directory by that name — `structure/corpus` and the archived `spike/s1/corpus` are six small trees
# written to be deliberately full of cycles so a cross-language extractor would have something to
# measure against (`docs/spikes/s1-cross-language-extraction.md`), and `api/corpus`, `calibration/g3`
# and `fuzz/corpus` are fixtures of the same kind. They are tracked files in every commit, so an
# unscoped graph reads `Circle.java → Shape.java` as a violation of an architecture nobody is trying to
# build, and the ratchet spends its findings on it — 3 of the 13 that `reco-wk4` was filed about. The
# name matches directories a path runs through, so the module `src/search/corpus.rs` stays in the graph;
# `tests/graph.rs` reads this file and checks both halves of that sentence.
ignored_dirs = ["node_modules", "__pycache__", "corpus"]
# The ceiling on revision graphs one graph lane keeps materialised (`reco-93w`). Eviction is
# lossless — a snapshot is a fold of the `graph_delta` rows the store already has — so what this
# buys is not re-walking the anchor chain: ~0.4 ms for a delta apply against ~205 ms for a
# rebuild (spike `s3`). Sized for a session's worth of timeline navigation, not for the
# repository: raise it when paging back through yesterday's episodes starts feeling slow.
snapshot_cache_mib = 32

[layers]
# The intended architecture, exactly as ADR-002 §3 declares it: every arrow points downhill.
# The crate names are the ones `tools/workspace_model.py` owns, so `e0.7`'s scaffold cannot
# drift from this file without one of the two failing a check — that check is
# `tests/test_workspace_contract.py`, which reads the model and this table as one list.
# `fathom-fixtures` is absent on purpose: ADR-002 §4.4 keeps it out of every shipped build (R7), and
# a crate nobody links does not belong among the library layers `deps.license.library_layers` names.
l5_composition = ["crates/fathom-cli"]
l4_surfaces = ["crates/fathom-tui", "crates/fathom-mcp"]
l3_analysis = ["crates/fathom-analyze"]
l2_outside_door = ["crates/fathom-ingest"]
l1_durable_state = ["crates/fathom-store"]
l0_vocabulary = ["crates/fathom-core"]
contracts = ["src/recommender", "tools"]

# ADR-002 §5's crate boundaries, restated as rules the gate can judge — which is only true since
# **reco-842** closed the extractor gap that made them unfireable here.
#
# `tools/check_workspace.py lint` (`E01`–`E05`, `M02`, `M03`) has enforced §5 on every commit all along,
# at the granularity of the `[dependencies]` of eight Cargo manifests. `[layering]` judges a different
# object: the module graph, and until a workspace member was a corpus location a crate-boundary `use`
# left that corpus and was stored as nothing (item 4 of `docs/concepts/architecture-graph.md`). A rule
# over crate-shaped `[layers]` entries then judged ~2 400 same-crate edges, printed "0 findings", and
# called an architecture it had not looked at respected — the exact state `docs/concepts/layering.md` §2
# refuses in somebody else's config, and the reason this file carried
# `[check.severity] layering = "off"` (**reco-dg7**) instead. That line is gone.
#
# `order` is §3's ladder, bottom-first: every arrow the graph holds must point at or below its own rung.
# `no_upward` is §5.1's R1, and one line refuses every uphill edge at once; the two `forbid` lines are
# §5.2's *downhill-but-refused* edges, which need a rule of their own precisely because `no_upward`
# cannot see them. §5.3's façade rule is narrower than either — which module inside the crate a surface
# may name — and `[layering]` has no selector for a module prefix inside a layer, so `IMPORT_FACADES`
# stays the lint's job. The two are not duplicates: the lint refuses an edge a manifest declares, this
# refuses an edge the source actually reaches along.
#
# `contracts` is in `[layers]` and deliberately not in `order`. `src/recommender` and `tools` are a layer
# for the license and graph questions, not a rung in the crate ladder, and an edge into one is counted
# `unranked` — a stated state — rather than guessed into a rank this file does not claim. Test, example
# and bench trees are not ignored either: a dev-dependency is still a crate edge, and §5.1 makes no
# exception for it.
#
# Measured at 7be179f, the commit this block was written against. `fathom check --only layering` judges
# 7 222 dependency rows of this repository's own head graph, 869 of them across a layer boundary, and
# reports 0 findings; `fathom check --only layering --base HEAD~5 --head HEAD` reports the same zero for
# the range. The row prints its own denominator — *"869 of the 7 222 judged dependency rows cross a layer
# boundary"* — because a zero over rows no rule could disagree about is a different zero from this one,
# and **reco-842** is the ticket that could not tell the two apart.
[layering]
mode = "warn"
order = [
  "l0_vocabulary",
  "l1_durable_state",
  "l2_outside_door",
  "l3_analysis",
  "l4_surfaces",
  "l5_composition",
]
no_upward = true
forbid = [
  "one-reality: l4_surfaces -> l1_durable_state",
  "one-door: l4_surfaces -> l2_outside_door",
]
[check]
# The mode this repository runs its own gate in, declared rather than inherited — **reco-azy** is the ticket
# that asked which of the two this was, and the answer is `warn`: an opinion, written down, about a gate that
# is still being calibrated against the repository that wrote it. Like `[episode] boundaries` below, this line
# restates a built-in value on purpose. What it buys is not a different number, it is a file that has chosen
# one, so that `deny` stays a deliberate edit rather than a discovery.
#
# Measured at 17770d5, the commit this decision was written against:
# `fathom check --base HEAD~5 --head HEAD` reports `fail` — 8 findings, 7 `error` and 1 `warning` — and exits
# 0. Under `deny` all eight would block the build, and reading them says why that is not the rule yet:
#
#   * five of the seven `api/breaking` errors report a parameter and a return type removed from a function in
#     `tools/check_ticket_claims.py` whose signature is identical in both revisions — `rust_units` and
#     `key_pattern` are untouched anywhere in `git diff 40a1e3f..17770d5`, and `prose_units`, `claims` and
#     `main` changed only in their bodies. The sixth is a module constant of that same script, which really
#     did drop its `: list[str]` annotation. Filed as **reco-9k3**;
#   * the seventh is `src/recommender/store/cache.py`'s `resolve()`: a real signature change in a tree
#     nobody outside this repository installs — Fathom ships Rust crates — which is `e3.12`'s mistake about a
#     test file (**reco-u1i**) one directory over;
#   * the `warning` is `tests/untested-logic`: 51 test lines counted against 337 of new logic, under a floor
#     of 50 %, on an episode that arrived with Rust tests and a Python contract test — which is the check
#     `docs/concepts/ci-gate.md` itself calls a prompt rather than a proof.
#
# Why not silence those and flip the mode. `[check] ignore` would make a `deny` gate green in one line, and it
# would be exactly the state the gate exists to refuse: a clean bill of health for a surface it never judged.
# `docs/concepts/layering.md` §2 refuses that in somebody else's config, and this file honoured it in its own
# for two tickets — `[check.severity] layering = "off"` was the honest line while the graph held no crate edge
# (**reco-dg7**), and the `[layering]` block above is what replaced it once **reco-842** made one possible.
# The other failure mode is the one `docs/concepts/ci-gate.md` names: a gate that blocks a repository the day
# it is installed is a gate that gets deleted the day it blocks a release.
#
# What `warn` is *not*, and the half that is enforced anyway. In `warn` nothing decides an exit code, so the
# two invariants ADR-002 §7.3 cares most about — a required check that could not run, and a run that examined
# nothing — leave this build green: in a repository with no `[layering]` rules, `fathom check --only
# layering` prints `fathom check failed: nothing was examined` and exits 0, and used to do that here. It does
# not now: the row runs, prints how many dependency rows it judged, and 0 findings is an answer rather than
# an absence. That is asserted, not hoped for: the `check-gate` job in `.github/workflows/ci.yml` reads the
# run's `--format json` and fails when a check row is `blocked` or when no row `ran`. The volume here is
# advisory; the "did it look at all" rule is not.
#
# What turns this to `deny`, in order:
#   1. **reco-9k3** — the `api` check says something *true* about this repository's Python, and says which of
#      `tools/**` and `src/recommender/**` is a published surface at all; `[api] ignore` and `[api] private`
#      are the honest spellings of that answer once it is a finding about the code rather than a way to get
#      to green;
#   2. `check-gate` in `.github/workflows/ci.yml` stops accepting exit `7` as a result. Until that step
#     changes, the job tolerates a finding whatever this file claims, which is why the mode line was never
#     the whole decision and does not pretend to be one now;
#   3. then, and only then, `mode = "deny"` — at the merge where 1 and 2 have both landed.
mode = "warn"

[risk]
# An unreviewed episode is only worth an interruption if the interruption teaches something;
# the weights are the ranking knobs ADR-004 §6 says change `risk.score` and nothing else.
# tau is §5.4's published default and it is a measured number: the Guardrail 3 corpus's own
# top-decile floor, confirmed against three real repositories by reco-6co. One number, also in
# ADR-001 §5.4, thresholds.json, the key spec and `Weights::defaults()`; the G3 harness refuses
# to run when the copies disagree.
tau = 40

[risk.weights]
# Three keys, chosen; the other nine features run at `Weights::defaults()`, which is the point of a weight
# block — a file that restates all twelve is a file whose decisions are invisible.
size = 0.3
test_ratio = 0.3
blast = 0.2
# `new_dependency` sat here at 0.2 after `features-1` (`e4.4`) shipped the vector, and that vector has never
# had a feature by that name — `dependency` is the axis it sounds like: a key that configured nothing while
# looking like a decision, so anyone who later "raised the dependency weight" would have typed into a dead
# name and changed nothing (W43-05, **reco-gna**). It is deleted rather than rewritten as
# `dependency = 0.2`, because moving the number to the live name would move this repository's own scores — a
# fresh decision to make on its own merits, not one smuggled through a key fix.
# A dead key now costs a run: `fathom doctor` prints it as `config_ignored_key` with its remedy, and
# `fathom doctor --strict` leaves with 5 for it. `fathom why --weights` prints the twelve, with defaults.

[episode]
# ADR-003 §4.5: the boundary order is fixed by the ADR and is *not* configurable, because the order is an
# argument about which evidence is trustworthy. This line restates the canonical prefix; a different value
# is named on the run that ignored it rather than obeyed quietly. Move a boundary with force_split /
# force_merge below — those are specific, named, and recorded on the episode as `overridden`.
boundaries = ["hook", "trailer", "author"]
# 30 minutes, and it is the same 30 in the schema, the docs and the Rust default (ADR-003 §4.4); `s2`
# (reco-q6r) is the ticket that moves it, with measurements.
time_gap_minutes = 30
# A boundary a human drew is a rule too, and the only one that outranks the heuristics instead of
# competing with them. Two spellings, `oid:<prefix>` and `subject:<substring>`; an entry that is
# neither is named on the next run rather than quietly dropped, and an episode whose boundary was
# forced says so in `fathom show`.
# force_split = ["subject:address review", "oid:1a2b3c"]
# force_merge = ["subject:typo"]

[attribution]
# Who wrote a commit (`e4.1`, reco-w7q). Like `[episode]`, the *order* of the ladder is not configurable:
# it is an argument about which class of evidence is trustworthy, and a ladder a user reordered is an
# authorship nobody can explain. What is configurable is what the ladder is allowed to recognise.
# trust_committer = false     # a bot that applies a human's change moves the committer and leaves the
                               # author alone; a repository whose CI commits everything should say so
                               # rather than read every episode as `agent`.
# ambiguous_below = 0.6       # raise it and Fathom prints `?` with the reason instead of the weak label
                               # the evidence would have supported. The built-in 0.50 prices the weakest
                               # rung exactly at the bar, so nothing is demoted until a repo asks for it.
# markers = ["worktree-bot"]  # added to the built-in agent-shaped markers, never replacing them — a
                               # marker table that replaced the built-ins would relabel Copilot's commits
                               # as human work. A marker that matches only inside an address's *domain*
                               # is read as ambiguity, not as an agent.

# The registry: the id is what the label prints as the agent's name, the patterns are lower-cased
# substrings of an author, committer or trailer identity. Also added to the built-ins (codex, copilot,
# claude, devin, aider, renovate, …) for the same reason.
[attribution.agents]
# fathom-fixtures = ["fathom-fixtures"]

[intent]
# What an episode was *for* (`e4.2`, reco-c54). The ladder that answers that question — the harness
# prompt, then a declared intent, then the `Agent-Intent:` trailer, then a plan item, then a `Task:`
# line, then a prompt digest — is not configurable in its ORDER, only in its membership: an intent a user
# reordered is an intent nobody can explain, and a `Task:` line is an ADR-003 §8 fallback, not an
# equal of a prompt.
# sources = ["agent-intent-trailer"]  # **replaces** the list, because the only interesting use of this
                                      # key is to turn something off: a repository whose prompts carry
                                      # names it does not want quoted says "only the trailer I declared".
                                      # An entry naming no rung this build reads is a notice, not an
                                      # error — `review-note` and `manual-note` are spellings
                                      # `[deps.provenance] intent_sources` already lists.
# digest_counts = false               # a prompt digest with no text counts as an intent (`digest-only`)
                                      # by default, because "a request happened and its text was not
                                      # captured" is a fact. Off, and such an episode reads `no recorded
                                      # intent` like any other.
# max_text_bytes = 4096               # a prompt is a paragraph, not a file: ADR-005 §6.3 forbids file
                                      # contents crossing this boundary, and text over the cap is kept
                                      # truncated with `truncated: true` said out loud.
# plan_cap = 64                       # plan items kept per episode; the document counts what it dropped
                                      # rather than letting a plan silently end.
# scope_cap = 64                      # declared-scope globs kept. An absolute path, a `..` or a NUL is
                                      # refused and named in `scope_rejected`, never normalised into
                                      # something that reads as a repository-relative glob. Nothing in
                                      # this build enforces the scope: it is recorded for `e4.3`'s
                                      # scope-creep detector, which measures the change against it.

# The write pipeline's back-pressure (`reco-93w`). This many normalized batches may sit between
# the spine and the writer before the spine WAITS instead of allocating: peak spine memory is
# roughly `queue_batches × commits_per_batch` records. 1 serializes the two stages and costs a
# cold index the overlap between normalizing batch n+1 and committing batch n; past a handful the
# queue is a cache with none of a cache's accounting, so the schema stops at 64.
[write]
queue_batches = 2

[cache]
# `cache.budget.mib` is the durable ceiling on class-R cache payloads (ADR-004 §8.6) and comes from the
# size class, so it is not set here — but §8.6's protection set is, because the default (a day)
# is a judgement about a person working in a repository rather than a job working through one:
# nothing used inside this window is evicted, however cold the rest of the table is. Set to 0 for
# a CI job that wants the budget honoured to the byte in one pass, whatever it then re-computes.
protect_recent_minutes = 1440

[retention]
# ADR-004 §8.2's windows, restated here only to widen the store-growth history: the CI budget
# gate (`e0.11`) wants two quarters of `usage_snapshot` rows to call a trend a trend.
usage_snapshot_days = 180

[repo]
# Probed per ADR-004 §11.1 (commits and files, stricter class wins) and printed by
# `fathom config explain`. `auto` here is documentation, not a dependency on the probe.
size_class = "auto"
