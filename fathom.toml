# Fathom's own `fathom.toml` — this repository, configured with the system `e0.8` ships.
#
# It is deliberately a real config, not an example: CI validates it against
# `schemas/fathom.schema.json` and `tests/test_config_contract.py` asserts it resolves with
# **zero warnings**, which is the cheapest way to keep the schema, the key spec and this file
# honest about each other. An example config that nothing checks rots in a week.
#
# Layered as flags > $FATHOM_* > this file > user config > built-in defaults; every effective
# value is explainable with `fathom config explain`.

meta.config_version = 1

[deps]
# The workspace is Rust plus the Python contract fixtures of ADR-002/004/005. Listing only what
# is here is not politeness: `deps.ecosystems` is an analyzer input (ADR-004 §5.1), so a
# stale entry is a cache key that moves for no reason.
ecosystems = ["python", "rust"]

[noise]
# Change that carries no reviewable information. `extend`, so these add to the built-ins
# instead of replacing them, and a `!` line re-promotes a path a broader glob swallowed.
globs = [
  "**/__pycache__/**",
  "**/.pytest_cache/**",
  ".plan/plan.json",          # generated by `.plan/gen.py`; the diff is the generator's
  "benchmarks/reports/**",    # measured output, not source
]
builtins_version = 1

[test]
globs = ["tests/**", "**/test_*.py"]

[non_code]
# Surfaces `e2.8` reports separately from code: CI, budgets and the generated schema are all
# reviewed as contracts, not as lines of logic.
patterns = [".github/workflows/**", "benchmarks/budgets.json", "schemas/**", ".plan/**"]

[graph]
ignored_dirs = ["node_modules", "__pycache__"]

[layers]
# The intended architecture, exactly as ADR-002 §3 declares it: every arrow points downhill.
# The crate names are the ones `tools/workspace_model.py` owns, so `e0.7`'s scaffold cannot
# drift from this file without one of the two failing a check.
l5_composition = ["crates/fathom-cli"]
l4_surfaces = ["crates/fathom-tui", "crates/fathom-mcp"]
l3_analysis = ["crates/fathom-analyze"]
l2_outside_door = ["crates/fathom-ingest"]
l1_durable_state = ["crates/fathom-store"]
l0_vocabulary = ["crates/fathom-core"]
contracts = ["src/recommender", "tools"]

[risk]
# An unreviewed episode is only worth an interruption if the interruption teaches something;
# the weights are the ranking knobs ADR-004 §6 says change `risk.score` and nothing else.
tau = 70

[risk.weights]
size = 0.3
test_ratio = 0.3
blast = 0.2
new_dependency = 0.2

[episode]
# ADR-003 is still open (`e0.3`), so the boundary order here is the plan's current guess and is
# `replace`, not `extend`: the order is the meaning.
boundaries = ["hook", "trailer", "author"]
time_gap_minutes = 30

[retention]
# ADR-004 §8.2's windows, restated here only to widen the store-growth history: the CI budget
# gate (`e0.11`) wants two quarters of `usage_snapshot` rows to call a trend a trend.
usage_snapshot_days = 180

[repo]
# Probed per ADR-004 §11.1 (commits and files, stricter class wins) and printed by
# `fathom config explain`. `auto` here is documentation, not a dependency on the probe.
size_class = "auto"
