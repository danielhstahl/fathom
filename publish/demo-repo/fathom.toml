# The gate's policy for the miniature (`fathom check` reads this table; nothing else here does).
#
# `warn` and not `enforce`, on purpose: the miniature introduces four new direct dependencies between its
# first commit and its tip, and that is the exhibit rather than a defect. A gate that is red by design is
# a gate a reader stops opening, so the committed policy reports and does not block, and the README shows
# the `enforce` run with its exit 7 as the thing to look at.
#
# Every key here is the same key your own repository would carry; `fathom config explain check.mode`
# prints which layer won any of them.
[check]
mode = "warn"
fail_on = "warning"

# The two loop detectors ship switched off: their false-positive rate has not been measured on real
# repositories yet, and a detector that cries wolf costs the reviewer's attention. This repository turns
# them on because it contains a churn loop on purpose (`src/retry.rs`, four episodes, one put-back) and
# the exhibit should be live the day the calibration lands. Today neither fires on it, and
# `PATHOLOGIES.md` says so instead of pretending otherwise.
[detectors]
enabled = ["churn_loop", "rework_loop"]

# The intended shape of the miniature, so the `layering` check has something to enforce instead of
# reporting itself blocked. Two layers and one rule: the dashboard is a consumer of the core, never the
# other way round. `fathom check --explain` prints the rule as read.
[layers]
core = ["src/"]
dashboard = ["dashboard/"]

[layering]
forbid = ["no-dashboard-uptake: core -> dashboard"]
